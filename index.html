<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        [draggable="true"] { cursor: grab; }
        .dragging { opacity: 0.5; }
    </style>
</head>
<body class="bg-gray-100 p-5">

    <nav class="mb-6 flex gap-2">
        <button onclick="showTab('plan')" class="bg-teal-800 text-white px-4 py-2 rounded">Plan</button>
        <button onclick="showTab('names')" class="bg-teal-800 text-white px-4 py-2 rounded">Personal</button>
        <button onclick="showTab('services')" class="bg-teal-800 text-white px-4 py-2 rounded">Leistungen</button>
    </nav>

    <div id="plan" class="tab-content active">
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-3 py-1 text-sm rounded mb-4">PDF Export</button>
        <div id="print-area" class="bg-white p-2">
            <table class="w-full border-collapse border text-[10px]" id="tour-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="names" class="tab-content">
        <input type="text" id="name-input" class="border p-2" placeholder="Name">
        <button onclick="addItem('names')" class="bg-green-700 text-white p-2">Hinzufügen</button>
        <ul id="name-list" class="mt-4"></ul>
    </div>

    <div id="services" class="tab-content">
        <input type="text" id="service-input" class="border p-2" placeholder="Leistungskürzel (z.B. BZ)">
        <button onclick="addItem('services')" class="bg-green-700 text-white p-2">Hinzufügen</button>
        <ul id="service-list" class="mt-4"></ul>
    </div>

    <script>
        let state = { names: [], services: ['KP', 'GP'] };
        let draggedRow = null;

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function addItem(type) {
            const input = document.getElementById(type === 'names' ? 'name-input' : 'service-input');
            if(input.value) {
                type === 'names' ? state.names.push(input.value) : state.services.push(input.value);
                input.value = '';
                renderAll();
            }
        }

        function renderAll() {
            // Render Listen
            document.getElementById('name-list').innerHTML = state.names.map((n, i) => `<li>${n} <button onclick="removeItem('names', ${i})" class="text-red-500">x</button></li>`).join('');
            document.getElementById('service-list').innerHTML = state.services.map((s, i) => `<li>${s} <button onclick="removeItem('services', ${i})" class="text-red-500">x</button></li>`).join('');
            
            // Render Table Header
            const head = document.getElementById('table-head');
            head.innerHTML = `<tr><th class="border p-1">Zeit</th>` + ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<th class="border p-1">${d}<br><div class="flex gap-1 justify-center">${state.services.map(s => `<span>${s}</span>`).join('')}</div></th>`).join('') + `</tr>`;
            
            // Render Rows
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (let i = 6; i <= 13; i++) {
                const tr = document.createElement('tr');
                tr.draggable = true;
                tr.innerHTML = `<td class="border p-2 font-bold">${i}:00</td>` + Array(7).fill(0).map(() => `<td class="border p-1"><select class="w-full"><option>...</option>${state.names.map(n => `<option>${n}</option>`).join('')}</select><div class="flex gap-1">${state.services.map(() => `<input type="checkbox">`).join('')}</div></td>`).join('');
                
                tr.ondragstart = () => draggedRow = tr;
                tr.ondragover = (e) => e.preventDefault();
                tr.ondrop = (e) => {
                    e.preventDefault();
                    const target = e.target.closest('tr');
                    if(target && target !== draggedRow) {
                        tbody.insertBefore(draggedRow, target);
                    }
                };
                tbody.appendChild(tr);
            }
        }

        function removeItem(type, idx) {
            type === 'names' ? state.names.splice(idx, 1) : state.services.splice(idx, 1);
            renderAll();
        }

        function exportPDF() {
            html2pdf().set({ jsPDF: { orientation: 'landscape' } }).from(document.getElementById('print-area')).save();
        }

        renderAll();
    </script>
</body>
</html>
</body>
