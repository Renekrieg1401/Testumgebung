<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="no-print mb-6">
        <nav class="flex gap-2 mb-4">
            <button onclick="showPage('plan')" class="bg-teal-700 text-white px-4 py-2 rounded">Tourenplan</button>
            <button onclick="showPage('data')" class="bg-teal-700 text-white px-4 py-2 rounded">Klienten</button>
            <button onclick="showPage('services')" class="bg-teal-700 text-white px-4 py-2 rounded">Leistungen</button>
        </nav>
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-4 py-2 rounded mb-4">PDF Drucken</button>
    </div>

    <div id="print-area" class="bg-white p-6">
        <h1 class="text-2xl font-bold mb-4 text-center">Tourenplan</h1>
        <div class="mb-4">
            <label class="font-bold">Tour: </label>
            <input type="text" class="border-b-2 border-gray-400 w-64 outline-none" placeholder="Tour eintragen...">
        </div>
        
        <table class="w-full border-collapse border text-sm" id="plan-table">
            <thead>
                <tr class="bg-gray-200">
                    <th class="border p-2">Anzahl</th>
                    ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<th class="border p-2">${d}</th>`).join('')}
                </tr>
            </thead>
            <tbody id="plan-body"></tbody>
        </table>
    </div>

    <div id="page-data" class="page">
        <h2 class="font-bold">Klienten</h2>
        <input id="client-in" class="border p-1"><button onclick="addItem('clients','client-in')" class="bg-green-600 text-white px-2">Add</button>
        <ul id="client-list"></ul>
    </div>

    <div id="page-services" class="page">
        <h2 class="font-bold">Leistungen</h2>
        <input id="service-in" class="border p-1"><button onclick="addItem('services','service-in')" class="bg-green-600 text-white px-2">Add</button>
        <ul id="service-list"></ul>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('gpa')) || { clients: [], services: [], schedule: { Mo:[],Di:[],Mi:[],Do:[],Fr:[],Sa:[],So:[] } };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
        }

        function addItem(key, inputId) {
            state[key].push(document.getElementById(inputId).value);
            save();
        }

        function save() { localStorage.setItem('gpa', JSON.stringify(state)); render(); }

        function render() {
            const body = document.getElementById('plan-body');
            body.innerHTML = '';
            const days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
            const max = Math.max(...Object.values(state.schedule).map(d => d.length), 5);
            
            for(let i=0; i<max; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="border p-2 font-bold">${i+1}</td>` + 
                    days.map(d => `<td class="border p-1">
                        <select class="w-full border-b mb-1"><option>Klient...</option>${state.clients.map(c=>`<option>${c}</option>`).join('')}</select>
                        <select class="w-full border-b text-xs"><option>Leistung...</option>${state.services.map(s=>`<option>${s}</option>`).join('')}</select>
                    </td>`).join('');
                body.appendChild(tr);
            }
            // Listen aktualisieren
            document.getElementById('client-list').innerHTML = state.clients.map(c=>`<li>${c}</li>`).join('');
            document.getElementById('service-list').innerHTML = state.services.map(s=>`<li>${s}</li>`).join('');
        }

        function exportPDF() { html2pdf().from(document.getElementById('print-area')).save(); }
        
        showPage('plan');
        render();
    </script>
</body>
</html>
