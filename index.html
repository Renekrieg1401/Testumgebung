<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { table-layout: fixed; width: 100%; border-collapse: collapse; }
        .service-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; align-items: center; justify-items: center; }
        .service-grid span { font-size: 7px; font-weight: bold; }
        .drag-handle { cursor: move; }
    </style>
</head>
<body class="bg-gray-100 p-2">

    <nav class="mb-4 flex gap-2">
        <button onclick="showTab('plan')" class="bg-teal-800 text-white px-3 py-1 rounded text-sm">Plan</button>
        <button onclick="showTab('clients')" class="bg-teal-800 text-white px-3 py-1 rounded text-sm">Klienten</button>
        <button onclick="showTab('services')" class="bg-teal-800 text-white px-3 py-1 rounded text-sm">Leistungen</button>
    </nav>

    <div id="plan" class="tab-content active">
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-3 py-1 text-sm rounded mb-2">PDF Export</button>
        <div id="print-area" class="bg-white p-1">
            <table id="tour-table" class="text-[9px]">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="clients" class="tab-content">
        <input type="text" id="client-input" class="border p-1" placeholder="Name">
        <button onclick="addItem('clients')" class="bg-green-700 text-white p-1">Hinzufügen</button>
        <ul id="client-list" class="mt-2"></ul>
    </div>

    <div id="services" class="tab-content">
        <input type="text" id="service-input" class="border p-1" placeholder="Kürzel">
        <button onclick="addItem('services')" class="bg-green-700 text-white p-1">Hinzufügen</button>
        <ul id="service-list" class="mt-2"></ul>
    </div>

    <script>
        let state = { clients: [], services: ['KP', 'GP', 'VW', 'KS', 'BZ', 'Tbl', 'Medi', 'UHbA'] };
        
        try {
            const saved = localStorage.getItem('gpa-data');
            if(saved) state = JSON.parse(saved);
        } catch(e) { localStorage.clear(); }

        function save() { localStorage.setItem('gpa-data', JSON.stringify(state)); renderAll(); }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function addItem(type) {
            const input = document.getElementById(type === 'clients' ? 'client-input' : 'service-input');
            if(input.value) {
                type === 'clients' ? state.clients.push(input.value) : state.services.push(input.value);
                input.value = ''; save();
            }
        }

        function clearRow(btn) {
            const row = btn.closest('tr');
            row.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            row.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
        }

        function renderAll() {
            const head = document.getElementById('table-head');
            head.innerHTML = `<tr><th class="border p-1 w-10">Zeit</th>` + ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `
                <th class="border p-1">${d}<div class="service-grid">${state.services.map(s => `<span>${s}</span>`).join('')}</div></th>`).join('') + `</tr>`;
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (let i = 6; i <= 13; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="border p-1 font-bold">${i}:00</td>` + Array(7).fill(0).map(() => `
                    <td class="border p-1">
                        <div class="flex items-center gap-1">
                            <select class="w-full border drag-handle" draggable="true" ondragstart="drag(event)">
                                <option>Klient...</option>${state.clients.map(c => `<option>${c}</option>`).join('')}
                            </select>
                            <button onclick="clearRow(this)" class="text-red-500">x</button>
                        </div>
                        <div class="service-grid">${state.services.map(() => `<input type="checkbox" class="w-2 h-2">`).join('')}</div>
                    </td>`).join('');
                tbody.appendChild(tr);
            }
            document.getElementById('client-list').innerHTML = state.clients.map((c, i) => `<li>${c} <button onclick="removeItem('clients', ${i})" class="text-red-500">x</button></li>`).join('');
            document.getElementById('service-list').innerHTML = state.services.map((s, i) => `<li>${s} <button onclick="removeItem('services', ${i})" class="text-red-500">x</button></li>`).join('');
        }

        function drag(e) { e.dataTransfer.setData("text", e.target.closest('tr').rowIndex); }
        // Drag-Drop Logik für ganze Zeilen basiert auf dem Index
        
        function removeItem(type, idx) {
            type === 'clients' ? state.clients.splice(idx, 1) : state.services.splice(idx, 1);
            save();
        }

        function exportPDF() { html2pdf().set({ jsPDF: { orientation: 'landscape', format: 'a4' } }).from(document.getElementById('print-area')).save(); }

        document.addEventListener('DOMContentLoaded', renderAll);
    </script>
</body>
</html>
