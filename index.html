<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-handle { cursor: move; color: #aaa; }
        .cell-container { border: 1px solid #ccc; padding: 2px; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div id="app" class="max-w-6xl mx-auto bg-white p-4 shadow">
        <h1 class="text-xl font-bold mb-4">GPA Tourenplan</h1>
        <table class="w-full border-collapse border" id="main-table">
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        // Daten-Initialisierung
        let clients = ["Klient A", "Klient B"];
        let services = ["KP", "GP", "VW"];

        // Rendering-Logik
        function init() {
            const tbody = document.getElementById('tbody');
            if (!tbody) return;
            
            tbody.innerHTML = '';
            for (let i = 6; i <= 13; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-2 font-bold border">${i}:00 <span class="drag-handle">⠿</span></td>`;
                
                for (let d = 0; d < 7; d++) {
                    tr.innerHTML += `
                        <td class="cell-container">
                            <div class="flex justify-between items-center">
                                <select class="w-full text-xs">
                                    <option>Name...</option>
                                    ${clients.map(c => `<option>${c}</option>`).join('')}
                                </select>
                                <span class="drag-handle ml-1">⠿</span>
                            </div>
                            <div class="flex gap-1 mt-1">
                                ${services.map(() => `<input type="checkbox" class="w-3 h-3">`).join('')}
                            </div>
                        </td>`;
                }
                tbody.appendChild(tr);
            }
        }

        // Sicherer Start
        window.onload = init;
    </script>
</body>
</html>
