<style>
    .service-grid { 
        display: grid; 
        /* Erzwingt eine minimale Breite pro Kürzel, um Überschneidungen zu verhindern */
        grid-template-columns: repeat(8, minmax(25px, 1fr)); 
        gap: 1px; 
        align-items: center; 
        justify-items: center; 
    }
    .service-grid span {
        font-size: 8px; /* Schriftgröße leicht reduziert */
        white-space: nowrap; /* Verhindert Zeilenumbruch innerhalb des Kürzels */
        transform: scale(0.9); /* Skaliert leicht, falls Platzmangel besteht */
    }
    /* Erhöht die Breite der Tagesspalte allgemein */
    th { min-width: 200px; }
</style>
</body>
