<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan - Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-handle { cursor: grab; user-select: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { table-layout: fixed; width: 100%; border-collapse: collapse; }
        .cell-container { position: relative; padding-right: 15px; }
        .cell-handle { position: absolute; right: 0; top: 0; cursor: grab; color: #999; }
    </style>
</head>
<body class="bg-gray-100 p-2">

    <div id="plan" class="tab-content active">
        <table id="tour-table" class="border">
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        // Logik für Drag & Drop
        function renderAll() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (let i = 6; i <= 13; i++) {
                const tr = document.createElement('tr');
                tr.className = "border-b";
                
                // Zeitspalte mit Zeilen-Handle
                tr.innerHTML = `<td class="font-bold drag-handle" draggable="true" ondragstart="startRowDrag(event)">${i}:00 ⠿</td>`;
                
                // Zell-Generierung
                for (let d = 0; d < 7; d++) {
                    tr.innerHTML += `
                        <td class="border cell-container" draggable="true" ondragstart="startCellDrag(event)">
                            <div class="cell-handle">⠿</div>
                            <select class="w-full text-[9px]"><option>Klient...</option></select>
                            <div class="flex gap-[2px]">Leistungs-Checkboxen...</div>
                        </td>`;
                }
                tbody.appendChild(tr);
            }
        }

        // Steuerung
        function startRowDrag(e) { /* Logik für Zeilen-Tausch */ }
        function startCellDrag(e) { /* Logik für Zell-Tausch (Inhalt kopieren/löschen) */ }
    </script>
</body>
</html>
