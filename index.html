<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .page { display: none; }
        .page.active { display: block; }
        .service-pill { font-size: 8px; display: inline-flex; flex-direction: column; align-items: center; width: 22px; margin-bottom: 2px; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="no-print mb-6">
        <nav class="flex gap-2 mb-4">
            <button onclick="showPage('plan')" class="bg-teal-700 text-white px-4 py-2 rounded">Tourenplan</button>
            <button onclick="showPage('clients')" class="bg-teal-700 text-white px-4 py-2 rounded">Klienten</button>
            <button onclick="showPage('services')" class="bg-teal-700 text-white px-4 py-2 rounded">Leistungen</button>
        </nav>
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-4 py-2 rounded">PDF Drucken</button>
    </div>

    <div id="print-area" class="bg-white p-6 shadow-lg">
        <h1 class="text-xl font-bold mb-2 text-center">Tourenplan</h1>
        <input type="text" class="border-b-2 border-gray-400 w-full mb-6" placeholder="Tourname...">
        
        <table class="w-full border-collapse border text-[10px]" id="plan-table">
            <thead>
                <tr class="bg-gray-200">
                    <th class="border p-2 w-12">Nr.</th>
                    <th class="border p-2">Mo</th><th class="border p-2">Di</th><th class="border p-2">Mi</th>
                    <th class="border p-2">Do</th><th class="border p-2">Fr</th><th class="border p-2">Sa</th><th class="border p-2">So</th>
                </tr>
            </thead>
            <tbody id="plan-body"></tbody>
        </table>
    </div>

    <div id="page-clients" class="page mt-6">
        <h2 class="font-bold">Klienten</h2>
        <input id="in-client" class="border p-1"><button onclick="addEntry('clients', 'in-client')" class="bg-green-600 text-white px-2">Hinzufügen</button>
        <ul id="list-clients" class="list-disc ml-5 mt-2"></ul>
    </div>

    <div id="page-services" class="page mt-6">
        <h2 class="font-bold">Leistungen</h2>
        <input id="in-service" class="border p-1"><button onclick="addEntry('services', 'in-service')" class="bg-green-600 text-white px-2">Hinzufügen</button>
        <ul id="list-services" class="list-disc ml-5 mt-2"></ul>
    </div>

    <script>
        var state = JSON.parse(localStorage.getItem('gpa_data'));
        if (!state) {
            state = { clients: [], services: [], schedule: { Mo:[],Di:[],Mi:[],Do:[],Fr:[],Sa:[],So:[] } };
        }

        function showPage(id) {
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('active');
            }
            document.getElementById('page-' + id).classList.add('active');
        }

        function clearCell(btn) {
            var cell = btn.parentElement;
            var selects = cell.querySelectorAll('select');
            for (var i = 0; i < selects.length; i++) {
                selects[i].selectedIndex = 0;
            }
            var inputs = cell.querySelectorAll('input');
            for (var j = 0; j < inputs.length; j++) {
                inputs[j].checked = false;
            }
        }

        function addEntry(type, inputId) {
            var val = document.getElementById(inputId).value;
            if(val) { 
                state[type].push(val); 
                save(); 
                document.getElementById(inputId).value = ''; 
            }
        }

        function addSlot(day, index) {
            state.schedule[day][index] = { active: true };
            save();
        }

        function save() { 
            localStorage.setItem('gpa_data', JSON.stringify(state)); 
            render(); 
        }

        function render() {
            var body = document.getElementById('plan-body');
            body.innerHTML = '';
            var days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
            
            var maxRows = 15;
            for (var d = 0; d < days.length; d++) {
                var dayLen = state.schedule[days[d]].length;
                if (dayLen >= maxRows) {
                    maxRows = dayLen + 1;
                }
            }
            
            for(var i = 0; i < maxRows; i++) {
                var tr = document.createElement('tr');
                var html = '<td class="border p-2 font-bold text-center">' + (i+1) + '</td>';
                
                for(var k = 0; k < 7; k++) {
                    var day = days[k];
                    html += '<td class="border p-1 relative">';
                    if(state.schedule[day][i]) {
                        html += '<select class="w-full border-b mb-1"><option>Klient...</option>';
                        for(var c = 0; c < state.clients.length; c++) {
                            html += '<option>' + state.clients[c] + '</option>';
                        }
                        html += '</select>';
                        html += '<div class="flex flex-wrap">';
                        for(var s = 0; s < state.services.length; s++) {
                            html += '<div class="service-pill"><input type="checkbox"><span>' + state.services[s] + '</span></div>';
                        }
                        html += '</div>';
                        html += '<button onclick="clearCell(this)" class="text-[8px] text-red-500 underline ml-1">Leeren</button>';
                    } else {
                        html += '<button onclick="addSlot(\'' + day + '\', ' + i + ')" class="text-blue-600 font-bold">+</button>';
                    }
                    html += '</td>';
                }
                tr.innerHTML = html;
                body.appendChild(tr);
            }

            var cList = '';
            for(var cl = 0; cl < state.clients.length; cl++) {
                cList += '<li>' + state.clients[cl] + '</li>';
            }
            document.getElementById('list-clients').innerHTML = cList;

            var sList = '';
            for(var sl = 0; sl < state.services.length; sl++) {
                sList += '<li>' + state.services[sl] + '</li>';
            }
            document.getElementById('list-services').innerHTML = sList;
        }

        function exportPDF() { 
            html2pdf().set({jsPDF:{orientation:'landscape'}}).from(document.getElementById('print-area')).save(); 
        }
        
        showPage('plan');
        render();
    </script>
</body>
</html>
