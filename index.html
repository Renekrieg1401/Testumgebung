<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Klienten verwalten</title>
    <style>body { font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
    <h1>Klienten verwalten</h1>
    <input type="text" id="klientName" placeholder="Name eingeben...">
    <button onclick="addKlient()">Hinzufügen</button>
    <ul id="klientList"></ul>
    <button onclick="location.href='index.html'">Zurück zum Tourenplan</button>

    <script>
        function loadList() {
            const list = JSON.parse(localStorage.getItem('klienten') || '[]');
            const ul = document.getElementById('klientList');
            ul.innerHTML = '';
            list.forEach((name, index) => {
                ul.innerHTML += `<li>${name} <button onclick="removeKlient(${index})">Löschen</button></li>`;
            });
        }
        function addKlient() {
            const name = document.getElementById('klientName').value;
            if(!name) return;
            const list = JSON.parse(localStorage.getItem('klienten') || '[]');
            list.push(name);
            localStorage.setItem('klienten', JSON.stringify(list));
            loadList();
        }
        function removeKlient(index) {
            const list = JSON.parse(localStorage.getItem('klienten') || '[]');
            list.splice(index, 1);
            localStorage.setItem('klienten', JSON.stringify(list));
            loadList();
        }
        loadList();
    </script>
</body>
</html>
