<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tourenplan App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            @page { size: landscape; }
            body { -webkit-print-color-adjust: exact; }
        }
        .sticky-header { position: sticky; top: 0; background: white; z-index: 10; }
    </style>
</head>
<body class="p-4 bg-gray-50">

    <div id="app" class="max-w-6xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Tourenplan</h1>
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-4 py-2 rounded mb-4">Als PDF drucken (Querformat)</button>
        
        <div id="plan-container" class="bg-white p-4 border shadow">
            <table class="w-full border-collapse border" id="tour-table">
                <thead>
                    <tr>
                        <th class="border p-2">Zeit</th>
                        <th class="border p-2">Mo</th>
                        <th class="border p-2">Di</th>
                        <th class="border p-2">Mi</th>
                        <th class="border p-2">Do</th>
                        <th class="border p-2">Fr</th>
                        <th class="border p-2">Sa</th>
                        <th class="border p-2">So</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 15 Zeilen via JS generiert -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // PDF Export Logik
        function exportPDF() {
            const element = document.getElementById('plan-container');
            const opt = {
                margin: 0.5,
                filename: 'Tourenplan.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Dynamische Tabellengenerierung (Ausschnitt)
        const tbody = document.getElementById('table-body');
        for (let i = 6; i <= 20; i++) {
            const row = `<tr>
                <td class="border p-2">${i}:00</td>
                ${Array(7).fill('<td class="border p-2"><select><option>Name</option></select><input type="checkbox"></td>').join('')}
            </tr>`;
            tbody.innerHTML += row;
        }
    </script>
</body>
</html>
</body>
