<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2 text-sm">

    <div id="page-plan" class="page">
        <table class="w-full bg-white border" id="plan-table">
            <thead>
                <tr class="bg-gray-200">
                    <th class="border p-2">Zeit</th>
                    <th class="border p-2">Mo</th>
                    <th class="border p-2">Di</th>
                    <th class="border p-2">Mi</th>
                    <th class="border p-2">Do</th>
                    <th class="border p-2">Fr</th>
                    <th class="border p-2">Sa</th>
                    <th class="border p-2">So</th>
                </tr>
            </thead>
            <tbody id="plan-body"></tbody>
        </table>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('gpa')) || { 
            clients: ['Klient A', 'Klient B'], services: ['KP', 'GP'],
            schedule: { Mo:[], Di:[], Mi:[], Do:[], Fr:[], Sa:[], So:[] } 
        };

        function addSlot(day) {
            state.schedule[day].push({ client: '', services: new Array(state.services.length).fill(false) });
            save();
        }

        function save() { localStorage.setItem('gpa', JSON.stringify(state)); render(); }

        function render() {
            const body = document.getElementById('plan-body');
            body.innerHTML = '';
            
            // Zeilen basierend auf dem längsten Tag + 1 Puffer für den "+ Klient" Button
            const days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
            const maxRows = Math.max(...Object.values(state.schedule).map(d => d.length)) + 1;
            
            for(let i=0; i<maxRows; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-2 border font-bold">${i+1}</td>` + 
                    days.map(day => `
                        <td class="p-1 border">
                            ${state.schedule[day][i] ? `
                                <select class="w-full border"><option>...</option>${state.clients.map(c => `<option>${c}</option>`).join('')}</select>
                                <div class="flex gap-1 mt-1">${state.services.map(() => '<input type="checkbox">').join('')}</div>
                            ` : `<button onclick="addSlot('${day}')" class="text-blue-600 font-bold">+ Klient</button>`}
                        </td>`).join('');
                body.appendChild(tr);
            }
        }
        render();
    </script>
</body>
</html>
