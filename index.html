<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourenplan App</title>
    <style>
        @page { size: landscape; margin: 5mm; }
        body { font-family: sans-serif; padding: 5px; font-size: 10px; margin: 0; }
        
        .page { display: none; }
        .active { display: block; }
        
        /* Navigation */
        .nav-bar { display: flex; gap: 5px; margin-bottom: 5px; background: #f0f0f0; padding: 5px; }
        button { cursor: pointer; padding: 4px 8px; font-size: 10px; }

        /* Header Bereich */
        .header-content { border-bottom: 2px solid #333; margin-bottom: 10px; padding-bottom: 5px; }
        
        /* Tourenplan Styling */
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #000; padding: 1px; text-align: center; vertical-align: top; }
        
        .cell-content { display: flex; flex-direction: column; height: 100%; }
        .header-row { display: flex; justify-content: flex-end; height: 12px; }
        .undo-btn { cursor: pointer; border: none; background: none; font-size: 10px; color: #444; line-height: 1; padding: 0 2px; }
        
        select { width: 100%; font-size: 7px; margin-top: 1px; border: 1px solid #ccc; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button onclick="showPage('plan')">Tourenplan</button>
        <button onclick="showPage('klienten')">Klienten</button>
        <button onclick="showPage('leistungen')">Leistungen</button>
        <button onclick="window.print()" style="background: #4a90e2; color: white;">PDF Drucken</button>
    </div>

    <div id="plan" class="page active">
        <div class="header-content">
            <h1>Tourenplan</h1>
            <input type="text" id="tourName" placeholder="Tourname eingeben..." style="width:100%; box-sizing:border-box;" oninput="saveAppState()">
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th style="width:25px;">Nr.</th><th>Mo</th><th>Di</th><th>Mi</th><th>Do</th><th>Fr</th><th>Sa</th><th>So</th></tr></thead>
                <tbody id="plan-body"></tbody>
            </table>
        </div>
    </div>

    <div id="klienten" class="page">
        <h1>Klienten</h1>
        <input type="text" id="kName"><button onclick="addData('klienten', 'kName')">Hinzufügen</button>
        <ul id="list-klienten"></ul>
    </div>

    <div id="leistungen" class="page">
        <h1>Leistungen</h1>
        <input type="text" id="lName"><button onclick="addData('leistungen', 'lName')">Hinzufügen</button>
        <ul id="list-leistungen"></ul>
    </div>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function addData(key, inputId) {
            const input = document.getElementById(inputId);
            const val = input.value.trim();
            if (!val) return;
            const list = JSON.parse(localStorage.getItem(key) || '[]');
            list.push(val);
            localStorage.setItem(key, JSON.stringify(list));
            input.value = '';
            renderLists();
            refreshDropdowns();
        }

        function del(key, i) {
            const list = JSON.parse(localStorage.getItem(key) || '[]');
            list.splice(i, 1);
            localStorage.setItem(key, JSON.stringify(list));
            renderLists();
            refreshDropdowns();
        }

        function renderLists() {
            ['klienten', 'leistungen'].forEach(key => {
                const list = JSON.parse(localStorage.getItem(key) || '[]');
                document.getElementById('list-' + key).innerHTML = list.map((item, i) => 
                    `<li>${item} <button onclick="del('${key}', ${i})">X</button></li>`).join('');
            });
        }

        function refreshDropdowns() {
            const kl = JSON.parse(localStorage.getItem('klienten') || '[]');
            const le = JSON.parse(localStorage.getItem('leistungen') || '[]');
            const optKl = '<option value="">-</option>' + kl.map(n => `<option value="${n}">${n}</option>`).join('');
            const optLe = '<option value="">-</option>' + le.map(n => `<option value="${n}">${n}</option>`).join('');
            
            document.querySelectorAll('.name-select').forEach(s => {
                const val = s.value;
                s.innerHTML = optKl;
                s.value = val;
            });
            document.querySelectorAll('.task-select').forEach(s => {
                const val = s.value;
                s.innerHTML = optLe;
                s.value = val;
            });
        }

        function saveAppState() {
            const state = {};
            document.querySelectorAll('select, input').forEach(el => {
                if (el.id || el.name) state[el.id || el.name] = el.value;
            });
            localStorage.setItem('appState', JSON.stringify(state));
        }

        function loadAppState() {
            const state = JSON.parse(localStorage.getItem('appState') || '{}');
            Object.keys(state).forEach(key => {
                const el = document.querySelector(`[id="${key}"], [name="${key}"]`);
                if (el) el.value = state[key];
            });
        }

        function clearCell(btn) {
            btn.closest('.cell-content').querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            saveAppState();
        }

        const tbody = document.getElementById('plan-body');
        for(let i=1; i<=15; i++) {
            let row = `<tr><td>${i}</td>`;
            for(let j=0; j<7; j++) {
                row += `<td>
                    <div class="cell-content">
                        <div class="header-row"><button class="undo-btn" onclick="clearCell(this)">↺</button></div>
                        <select class="name-select" name="k_${i}_${j}" onchange="saveAppState()"></select>
                        <div class="grid-container">
                            <select class="task-select" name="l_${i}_${j}_1" onchange="saveAppState()"></select>
                            <select class="task-select" name="l_${i}_${j}_2" onchange="saveAppState()"></select>
                        </div>
                    </div>
                </td>`;
            }
            tbody.innerHTML += row + '</tr>';
        }
        
        renderLists();
        refreshDropdowns();
        loadAppState();
    </script>
</body>
</html>
