<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .page { display: none; }
        .page.active { display: block; }
        .service-pill { font-size: 8px; display: inline-flex; flex-direction: column; align-items: center; width: 22px; margin-bottom: 2px; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="no-print mb-6">
        <nav class="flex gap-2 mb-4">
            <button onclick="showPage('plan')" class="bg-teal-700 text-white px-4 py-2 rounded">Tourenplan</button>
            <button onclick="showPage('clients')" class="bg-teal-700 text-white px-4 py-2 rounded">Klienten</button>
            <button onclick="showPage('services')" class="bg-teal-700 text-white px-4 py-2 rounded">Leistungen</button>
        </nav>
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-4 py-2 rounded">PDF Drucken</button>
    </div>

    <div id="print-area" class="bg-white p-6 shadow-lg">
        <h1 class="text-xl font-bold mb-2 text-center">Tourenplan</h1>
        <input type="text" class="border-b-2 border-gray-400 w-full mb-6" placeholder="Tourname...">
        
        <table class="w-full border-collapse border text-[10px]" id="plan-table">
            <tbody id="plan-body"></tbody>
        </table>
    </div>

    <div id="page-clients" class="page mt-6">
        <h2 class="font-bold">Klienten</h2>
        <input id="in-client" class="border p-1"><button onclick="addEntry('clients', 'in-client')" class="bg-green-600 text-white px-2">Hinzufügen</button>
        <ul id="list-clients" class="list-disc ml-5"></ul>
    </div>

    <div id="page-services" class="page mt-6">
        <h2 class="font-bold">Leistungen</h2>
        <input id="in-service" class="border p-1"><button onclick="addEntry('services', 'in-service')" class="bg-green-600 text-white px-2">Hinzufügen</button>
        <ul id="list-services" class="list-disc ml-5"></ul>
    </div>

    <script>
        var state = JSON.parse(localStorage.getItem('gpa_data')) || { clients: [], services: [], schedule: { Mo:[],Di:[],Mi:[],Do:[],Fr:[],Sa:[],So:[] } };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
            document.getElementById('page-' + id).classList.add('active');
        }

        // Fügt an Position index ein (einfügen vor/nach)
        function insertSlot(day, index, direction) {
            var targetIdx = (direction === 'after') ? index + 1 : index;
            state.schedule[day].splice(targetIdx, 0, { client: '', service: '' });
            save();
        }

        function addEntry(type, inputId) {
            var val = document.getElementById(inputId).value;
            if(val) { state[type].push(val); save(); document.getElementById(inputId).value = ''; }
        }

        function save() { localStorage.setItem('gpa_data', JSON.stringify(state)); render(); }

        function render() {
            var body = document.getElementById('plan-body');
            body.innerHTML = '';
            var days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
            var maxRows = Math.max(...Object.values(state.schedule).map(d => d.length + 1), 5);
            
            for(var i=0; i<maxRows; i++) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td class="border p-2 font-bold text-center">' + (i+1) + '</td>' + 
                    days.map(function(day) {
                        var html = '<td class="border p-1 relative">';
                        if(state.schedule[day][i]) {
                            html += '<select class="w-full border-b mb-1"><option>...</option>' + state.clients.map(c=>'<option>'+c+'</option>').join('') + '</select>';
                            html += '<div class="flex flex-wrap">' + state.services.map(s => '<div class="service-pill"><input type="checkbox"><span>'+s+'</span></div>').join('') + '</div>';
                            // Kontroll-Buttons zum Einfügen
                            html += '<div class="flex justify-between mt-1"><button onclick="insertSlot(\''+day+'\', '+i+', \'before\')" class="text-[8px] text-gray-400">^</button><button onclick="insertSlot(\''+day+'\', '+i+', \'after\')" class="text-[8px] text-gray-400">v</button></div>';
                        } else if(i === 0 || state.schedule[day][i-1]) {
                            html += '<button onclick="insertSlot(\''+day+'\', '+(i-1)+', \'after\')" class="text-blue-600 font-bold">+</button>';
                        }
                        return html + '</td>';
                    }).join('');
                body.appendChild(tr);
            }
            document.getElementById('list-clients').innerHTML = state.clients.map(c=>'<li>'+c+'</li>').join('');
            document.getElementById('list-services').innerHTML = state.services.map(s=>'<li>'+s+'</li>').join('');
        }
        function exportPDF() { html2pdf().set({jsPDF:{orientation:'landscape'}}).from(document.getElementById('print-area')).save(); }
        render();
    </script>
</body>
</html>
