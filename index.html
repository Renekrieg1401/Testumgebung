<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2 text-sm">

    <nav class="flex gap-2 mb-4 bg-white p-2 rounded shadow">
        <button onclick="showPage('plan')" class="bg-teal-700 text-white px-3 py-1 rounded">Plan</button>
        <button onclick="showPage('data')" class="bg-teal-700 text-white px-3 py-1 rounded">Klienten</button>
        <button onclick="showPage('services')" class="bg-teal-700 text-white px-3 py-1 rounded">Leistungen</button>
    </nav>

    <div id="page-plan" class="page">
        <table class="w-full bg-white border border-collapse" id="plan-table">
            <tbody id="plan-body"></tbody>
        </table>
    </div>

    <div id="page-data" class="page hidden">
        <input id="new-client" class="border p-1" placeholder="Name">
        <button onclick="addClient()" class="bg-green-600 text-white px-2 py-1">Hinzufügen</button>
        <ul id="client-list" class="mt-2"></ul>
    </div>

    <div id="page-services" class="page hidden">
        <input id="new-service" class="border p-1" placeholder="Kürzel">
        <button onclick="addService()" class="bg-green-600 text-white px-2 py-1">Hinzufügen</button>
        <ul id="service-list" class="mt-2"></ul>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('gpa')) || { clients: [], services: ['KP', 'GP'] };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
        }

        function save() { localStorage.setItem('gpa', JSON.stringify(state)); render(); }

        function render() {
            // Plan rendern
            const body = document.getElementById('plan-body');
            body.innerHTML = '';
            for(let i=6; i<=13; i++) {
                const tr = document.createElement('tr');
                tr.className = "border-b draggable";
                tr.draggable = true;
                tr.innerHTML = `<td class="p-2 font-bold w-12 border-r">${i}:00</td>` + 
                                Array(7).fill(0).map(() => `<td class="p-1 border"><select class="w-full"><option>...</option>${state.clients.map(c => `<option>${c}</option>`).join('')}</select><div class="flex">${state.services.map(() => '<input type="checkbox" class="mx-0.5">').join('')}</div></td>`).join('');
                body.appendChild(tr);
            }
            // Listen rendern
            document.getElementById('client-list').innerHTML = state.clients.map((c,i) => `<li>${c} <button onclick="state.clients.splice(${i},1);save()">x</button></li>`).join('');
            document.getElementById('service-list').innerHTML = state.services.map((s,i) => `<li>${s} <button onclick="state.services.splice(${i},1);save()">x</button></li>`).join('');
        }

        // Einfaches Drag & Drop
        document.addEventListener('dragstart', e => e.target.classList.contains('draggable') ? e.dataTransfer.setData('text', e.target.rowIndex) : null);
        document.addEventListener('drop', e => {
            const from = e.dataTransfer.getData('text');
            const to = e.target.closest('tr').rowIndex;
            if(from && to) { /* Tauschlogik hier */ render(); }
            e.preventDefault();
        });
        document.addEventListener('dragover', e => e.preventDefault());

        render();
    </script>
</body>
</html>
