<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourenplan Querformat</title>
    <style>
        /* Druck-spezifische Anweisung für Querformat */
        @page {
            size: landscape;
            margin: 10mm;
        }

        body {
            font-family: sans-serif;
            padding: 5px;
            background-color: #ffffff;
        }

        .table-container {
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px; /* Optimierte Schriftgröße für Querformat */
            table-layout: fixed; /* Erzwingt gleichmäßige Spaltenbreite */
        }

        th, td {
            border: 1px solid #000000;
            padding: 6px;
            text-align: center;
            overflow: hidden;
        }

        th {
            background-color: #e9ecef;
            font-weight: bold;
        }

        /* Dropdown-Styling für Druck optimiert */
        select {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 10px;
            text-align: center;
        }

        /* Spaltenbreiten definieren */
        th:first-child, td:first-child { width: 40px; }
    </style>
</head>
<body>

    <div class="table-container">
        <h3>Tourenplan</h3>
        <table>
            <thead>
                <tr>
                    <th>Nr.</th>
                    <th>Mo</th>
                    <th>Di</th>
                    <th>Mi</th>
                    <th>Do</th>
                    <th>Fr</th>
                    <th>Sa</th>
                    <th>So</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for(let i=1; i<=15; i++) {
                        document.write(`<tr>
                            <td>${i}</td>
                            ${'<td><select><option></option><option>Müller</option><option>Schmidt</option></select></td>'.repeat(7)}
                        </tr>`);
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
