<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan Pro - Symmetrisch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Grid-System für Symmetrie */
        .service-grid { 
            display: grid; 
            grid-template-columns: repeat(var(--service-count), minmax(20px, 1fr)); 
            gap: 2px; 
            align-items: center; 
            justify-items: center; 
        }
    </style>
</head>
<body class="bg-gray-100 p-5">

    <nav class="mb-6 flex gap-2">
        <button onclick="showTab('plan')" class="bg-teal-800 text-white px-4 py-2 rounded">Plan</button>
        <button onclick="showTab('names')" class="bg-teal-800 text-white px-4 py-2 rounded">Personal</button>
        <button onclick="showTab('services')" class="bg-teal-800 text-white px-4 py-2 rounded">Leistungen</button>
    </nav>

    <div id="plan" class="tab-content active">
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-3 py-1 text-sm rounded mb-4">PDF Export</button>
        <div id="print-area" class="bg-white p-2">
            <table class="w-full border-collapse border text-[10px]" id="tour-table" style="--service-count: 8;">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="names" class="tab-content"><input type="text" id="name-input" class="border p-2"><button onclick="addItem('names')" class="bg-green-700 text-white p-2">Hinzufügen</button><ul id="name-list"></ul></div>
    <div id="services" class="tab-content"><input type="text" id="service-input" class="border p-2"><button onclick="addItem('services')" class="bg-green-700 text-white p-2">Hinzufügen</button><ul id="service-list"></ul></div>

    <script>
        let state = { names: [], services: ['KP', 'GP', 'VW', 'KS', 'BZ', 'Tbl', 'Medi', 'UHbA'] };

        function renderAll() {
            const count = state.services.length;
            document.getElementById('tour-table').style.setProperty('--service-count', count);

            // Header-Render mit Grid
            const head = document.getElementById('table-head');
            head.innerHTML = `<tr><th class="border p-1">Zeit</th>` + 
                ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `
                    <th class="border p-1">
                        <div>${d}</div>
                        <div class="service-grid">
                            ${state.services.map(s => `<span>${s}</span>`).join('')}
                        </div>
                    </th>`).join('') + `</tr>`;
            
            // Body-Render mit Grid
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (let i = 6; i <= 13; i++) {
                const tr = document.createElement('tr');
                tr.draggable = true;
                tr.innerHTML = `<td class="border p-2 font-bold">${i}:00</td>` + 
                    Array(7).fill(0).map(() => `
                        <td class="border p-1">
                            <select class="w-full border mb-1"><option>Name...</option>${state.names.map(n => `<option>${n}</option>`).join('')}</select>
                            <div class="service-grid">
                                ${state.services.map(() => `<input type="checkbox" class="w-3 h-3">`).join('')}
                            </div>
                        </td>`).join('');
                
                // Drag-Events
                tr.ondragstart = (e) => draggedRow = tr;
                tr.ondrop = (e) => { e.preventDefault(); tbody.insertBefore(draggedRow, tr); };
                tr.ondragover = (e) => e.preventDefault();
                tbody.appendChild(tr);
            }
        }
        
        // ... (addItem, removeItem, showTab, exportPDF Funktionen wie zuvor)
        renderAll();
    </script>
</body>
</html>
</body>
