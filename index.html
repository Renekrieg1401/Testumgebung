<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #001828;   /* tiefer als #003049 */
    --bg2:   #002035;
    --bg3:   #003049;   /* Palette-Anker */
    --border:#005070;
    --text:  #e8f4f6;
    --muted: #8ab8c8;
    --dim:   #4a7888;
    --vdim:  #2a5060;
  }
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh; min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:#005070; border-radius:2px; }

  body::before {
    content:''; position:fixed; top:0; left:0; right:0; bottom:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
    pointer-events:none; z-index:9999;
  }

  #site-header {
    background:var(--bg2); border-bottom:1px solid var(--border);
    padding:0 20px; position:sticky; top:0; z-index:200;
    animation:slideDown .45s ease both;
  }
  .topbar {
    display:flex; justify-content:flex-start; align-items:center;
    padding:8px 0 7px; border-bottom:1px solid #1c1c18;
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em; color:#b0b0a4;
  }

  .title-row { padding:14px 0 11px; display:flex; align-items:flex-end; gap:14px; }
  .title-group h1 {
    font-family:'Playfair Display',serif; font-weight:900;
    font-size:clamp(22px,5vw,32px); letter-spacing:-.02em; color:var(--text); line-height:1;
  }
  .title-group h1 span { color:#D1AC00; }
  .slogan { margin-top:5px; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; color:#8ab8c8; }

  .header-meta {
    font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em;
    text-align:right; line-height:1.9; color:#8ab8c8;
  }
  .header-meta .meta-active { color:#D1AC00; }

  .tab-nav { display:flex; gap:0; margin-bottom:-1px; overflow-x:auto; scrollbar-width:none; }
  .tab-nav::-webkit-scrollbar { display:none; }
  .tab-btn {
    background:none; border:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; padding:10px 14px 11px;
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em; color:#7a7a70;
    border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
    display:flex; align-items:center; gap:6px; white-space:nowrap; flex-shrink:0;
  }
  .tab-btn .tab-icon { font-size:14px; }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab-btn .load-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); display:none; animation:blink .8s ease infinite; }
  .tab-btn.loading .load-dot { display:inline-block; }

  main { max-width:940px; margin:0 auto; padding:24px 16px 56px; }

  .cat-block {
    background:var(--bg3); border:1px solid var(--ac12);
    border-radius:3px; overflow:hidden; animation:fadeIn .3s ease both;
  }
  .cat-header {
    padding:13px 18px; display:flex; align-items:center; gap:9px;
    border-bottom:1px solid var(--ac14);
  }
  .cat-header-icon { font-size:17px; }
  .cat-header-label { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.15em; color:var(--accent); font-weight:700; }
  .cat-status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 7px var(--accent); margin-left:auto; }
  .cat-status-dot.loading { background:#f4c44a; box-shadow:0 0 7px #f4c44a; animation:blink .9s ease infinite; }

  .cards-wrap { padding:14px; display:flex; flex-direction:column; gap:10px; }

  .skeleton {
    height:72px; background:var(--ac05);
    border:1px solid var(--ac08);
    border-radius:2px; animation:shimmer 1.4s ease infinite;
  }

  .news-card {
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    background:linear-gradient(135deg,var(--ac08dark) 0%,rgba(255,255,255,.02) 100%);
    border:1px solid var(--ac16);
    border-radius:3px; padding:16px 18px; cursor:pointer; position:relative;
    transition:border-color .2s, box-shadow .2s, transform .18s;
    animation:fadeIn .4s ease both;
  }
  .news-card:hover { border-color:var(--ac40); transform:translateY(-1px); box-shadow:0 6px 20px var(--ac10); }
  .news-card.open  { border-color:var(--ac33); box-shadow:0 0 20px var(--ac12); }

  .card-accent-line { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--accent),transparent); opacity:.25; transition:opacity .2s; }
  .news-card.open .card-accent-line { opacity:1; }

  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-headline { font-family:'Playfair Display',serif; font-size:15px; font-weight:700; color:var(--text); line-height:1.35; flex:1; }
  .card-toggle { color:var(--accent); font-size:22px; flex-shrink:0; line-height:1; transition:transform .2s; }
  .news-card.open .card-toggle { transform:rotate(45deg); }
  .card-teaser { margin-top:9px; font-size:13px; color:var(--muted); line-height:1.55; }

  .card-body { margin-top:14px; padding-top:14px; border-top:1px solid var(--ac14); display:none; animation:expandIn .2s ease both; }
  .news-card.open .card-body { display:block; }

  .bedeutung-box {
    background:var(--ac06);
    border:1px solid var(--ac20);
    border-radius:2px; padding:11px 13px; margin-bottom:11px;
  }
  .bedeutung-label { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--accent); margin-bottom:6px; }
  .bedeutung-text  { font-size:13px; color:#d4d4cc; line-height:1.6; }
  .card-meta { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .card-source { font-family:'Space Mono',monospace; font-size:11px; color:var(--dim); }
  .trust-badge { display:flex; align-items:center; gap:5px; font-family:'Space Mono',monospace; font-size:11px; flex-shrink:0; }
  .trust-dot { width:7px; height:7px; border-radius:50%; }
  .trust-info {
    display:inline-flex; align-items:center; justify-content:center;
    width:13px; height:13px; border-radius:50%;
    border:1px solid var(--dim); color:var(--dim);
    font-family:'Space Mono',monospace; font-size:8px; line-height:1;
    cursor:pointer; flex-shrink:0; position:relative;
    transition:border-color .15s, color .15s;
  }
  .trust-info:hover { border-color:#D1AC00; color:#D1AC00; }
  .trust-tooltip {
    display:none; position:absolute; bottom:calc(100% + 7px); right:0;
    background:#002035; border:1px solid #005070;
    border-left:2px solid #D1AC00;
    padding:10px 12px; border-radius:2px;
    width:210px; z-index:500;
    font-family:'IBM Plex Sans',sans-serif; font-size:11px;
    color:var(--muted); line-height:1.55; white-space:normal;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    pointer-events:none; text-align:left;
  }
  .trust-tooltip strong { color:var(--text); display:block; margin-bottom:6px; font-size:11px; letter-spacing:.02em; }
  .trust-legend { display:flex; flex-direction:column; gap:4px; margin-top:4px; }
  .trust-legend span { display:flex; align-items:center; gap:6px; font-size:10px; }
  .tleg-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .trust-info:hover .trust-tooltip { display:block; }

  .teaser-grid { margin-top:24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:9px; }
  .teaser-card {
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    background:linear-gradient(135deg,var(--ac10dark) 0%,var(--bg3) 100%);
    border:1px solid var(--ac12);
    border-radius:3px; padding:14px 15px; cursor:pointer; text-align:left;
    transition:border-color .18s, transform .15s; animation:fadeIn .45s ease both; width:100%;
  }
  .teaser-card:hover { border-color:var(--ac35); transform:translateY(-1px); }
  .teaser-card-top  { display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .teaser-card-icon { font-size:14px; }
  .teaser-card-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.12em; color:var(--accent); }
  .teaser-card-text  { font-size:12px; color:#8ab8c8; line-height:1.45; }

  footer {
    border-top:1px solid #1e1e1a; padding:18px 20px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    font-family:'Space Mono',monospace; font-size:10px; color:var(--vdim); letter-spacing:.08em;
  }

  /* Update banner */
  #update-banner {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 9000;
    background: #0a0a08;
    border-top: 2px solid #D1AC00;
    padding: 14px 20px;
    align-items: center; justify-content: space-between; gap: 12px;
    animation: slideUp .35s ease both;
    box-shadow: 0 -4px 24px rgba(209,172,0,.2);
  }
  #update-banner.visible { display: flex; }
  .update-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px; letter-spacing: .08em;
    color: #8ab8c8; line-height: 1.5;
  }
  .update-text strong { color: #D1AC00; display: block; margin-bottom: 2px; }
  .update-btn {
    background: #D1AC00; color: #001828;
    border: none; border-radius: 2px;
    padding: 10px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background .15s, transform .1s;
  }
  .update-btn:active { transform: scale(.97); background: #b89500; }
  .update-dismiss {
    background: none; border: none; color: #4a7888;
    font-size: 18px; cursor: pointer; padding: 4px 8px;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }

  @keyframes slideUp { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn    { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
  @keyframes expandIn  { from{opacity:0;transform:scaleY(.93);transform-origin:top} to{opacity:1;transform:scaleY(1)} }
  @keyframes blink     { 0%,100%{opacity:1} 50%{opacity:.2} }
  @keyframes shimmer   { 0%,100%{opacity:.35} 50%{opacity:.65} }
  @keyframes slideDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }

  @media (max-width:480px) {
    .topbar { font-size:9px; }
    .tab-btn { padding:9px 7px 10px; gap:4px; }
    .tab-btn .tab-label { font-size:10px; letter-spacing:.04em; }
    .tab-btn .tab-icon  { font-size:13px; }
    main { padding:16px 12px 48px; }
    .teaser-grid { grid-template-columns:1fr 1fr; }
    footer { flex-direction:column; gap:4px; font-size:9px; }
  }
  @media (max-width:360px) { .teaser-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="update-banner" role="alert" aria-live="polite">

<script>
/* ═══════════════════════════════════════════
   AUTO-UPDATE: ETag-Check gegen den Server
   Funktioniert auch wenn die HTML selbst gecacht ist.
   Jeder Deploy auf GitHub Pages ändert ETag/Last-Modified.
═══════════════════════════════════════════ */
async function checkForUpdate(){
  if(!navigator.onLine) return;
  try{
    const res = await fetch(location.href, { method:"HEAD", cache:"no-store" });
    const tag = res.headers.get("ETag") || res.headers.get("Last-Modified") || "";
    if(!tag) return;
    const stored = localStorage.getItem("pbz-etag");
    localStorage.setItem("pbz-etag", tag);
    if(stored && stored !== tag){
      /* Neue Version → Banner anzeigen statt auto-reload */
      showUpdateBanner();
    }
  } catch(e){ /* offline – ignorieren */ }
}

function showUpdateBanner(){
  const b = document.getElementById("update-banner");
  if(b) b.classList.add("visible");
}

function doUpdate(){
  /* Caches leeren + hart neu laden */
  const reload = () => location.reload(true);
  if("caches" in window){
    caches.keys().then(keys => Promise.all(keys.map(k=>caches.delete(k)))).then(reload).catch(reload);
  } else { reload(); }
}

function dismissUpdate(){
  const b = document.getElementById("update-banner");
  if(b) b.classList.remove("visible");
}

/* Beim Start prüfen */
checkForUpdate();

/* visibilitychange: handled below together with enforceWeeklyRefresh */

  { id:"gesundheit", label:"Gesundheit",    icon:"\u2695\uFE0F", accent:"#c070a0", bg:"#1a0e15" },
  { id:"wirtschaft", label:"Wirtschaft",    icon:"\uD83D\uDCCA", accent:"#3db84e", bg:"#0a160c" },
];
const SEED = {
  /* KW 23 · Juni 2026 – Verifizierte Quellen */
  inland: [
    { id:1001, headline:"Kanzlertausch-Debatte: CDU unter Druck",
      teaser:"Eine neue Umfrage zeigt: Viele Deutsche trauen der CDU/CSU ohne Friedrich Merz mehr Erfolg zu. Wüst sicherte dem Kanzler beim Meschede-Treffen dennoch volle Unterstützung zu.",
      bedeutung:"Die Stabilität der Bundesregierung steht auf dem Prüfstand. Ein Kanzlerwechsel mitten in der Legislatur würde Gesetzgebungsprozesse verzögern – u. a. bei Renten, Haushalt und Infrastruktur.",

function trustColor(s){ return s>=90?"#3db84e":s>=80?"#D1AC00":"#b06090"; }
function hexToRgb(h){
  const x=h.replace('#','');
  const n=parseInt(x,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function setCSSAccent(el,a){
  const [r,g,b]=hexToRgb(a);
  el.style.setProperty("--accent",a);
  el.style.setProperty("--ac04dark","rgba("+r+","+g+","+b+",0.06)");
  el.style.setProperty("--ac05","rgba("+r+","+g+","+b+",0.05)");

/* ═══════════════════════════════════════════
   WÖCHENTLICHE AKTUALISIERUNG
   Jeden Montag 06:00 Uhr Berliner Zeit.
   Unabhängig von Zeitzone des Nutzers.
═══════════════════════════════════════════ */

/**
 * Gibt den Datums-Key des letzten "Montag 06:00 Uhr Berlin" zurück.
 * Z.B.: "2026-06-01" (= letzter Montag nach 06:00 Berliner Zeit)
 * Solange dieser Key gleich bleibt, wird kein neuer Fetch ausgelöst.
 */
function getRefreshKey(){
  // Aktuelle Zeit in Berliner Zeitzone
  const berlinStr = new Date().toLocaleString("en-US", { timeZone:"Europe/Berlin" });
  const berlin    = new Date(berlinStr);

  const dow  = berlin.getDay();   // 0=So, 1=Mo, ..., 6=Sa
  const hour = berlin.getHours();
  const min  = berlin.getMinutes();

  // Wie viele Tage zurück bis zum letzten Montag?
  // Sonderfall: Montag VOR 06:00 → noch alter Montag (7 Tage zurück)
  let daysBack = dow === 0 ? 6 : dow - 1;
  if(dow === 1 && (hour < 6 || (hour === 6 && min === 0))) daysBack = 7;

  const lastMonday = new Date(berlin);
  lastMonday.setDate(berlin.getDate() - daysBack);

  const y  = lastMonday.getFullYear();
  const m  = String(lastMonday.getMonth()+1).padStart(2,"0");
  const d  = String(lastMonday.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+d;   // z.B. "2026-06-01"
}

/**
 * Prüft beim App-Start ob ein neuer Montag (06:00 Berlin) vergangen ist.
 * Falls ja → alle gecachten KI-News löschen → frischer Fetch.
 */
function enforceWeeklyRefresh(){
  const key    = getRefreshKey();
  const stored = localStorage.getItem("pbz-refresh-key");
  if(stored !== key){
    // Neuer Wochenzyklus → localStorage UND In-Memory-State invalidieren
    CATEGORIES.forEach(cat=>{
      localStorage.removeItem("pbz-wk-"+cat.id);
      localStorage.removeItem("pbz-dt-"+cat.id);
      delete aiData[cat.id];    // In-Memory-Cache leeren
      loaded.delete(cat.id);    // Neu-Fetch erlauben
      loading.delete(cat.id);   // Hängenden Lade-State zurücksetzen
    });
    localStorage.setItem("pbz-refresh-key", key);
    console.log("[PBZ] Wöchentliche Aktualisierung ausgelöst für", key);
    return true; // Signal: Daten wurden invalidiert
  }
  return false;
}

// Beim Start und bei jedem Vordergrund-Wechsel prüfen
enforceWeeklyRefresh();
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible"){
    const didRefresh = enforceWeeklyRefresh(); // Inhalts-Cache prüfen
    checkForUpdate();                           // App-Version prüfen (ETag)
    if(didRefresh){
      // Neuer Wochenzyklus erkannt → UI + Daten sofort aktualisieren
      renderMain();
      loadCategory(activeTab);
    }
  }
});

async function loadCategory(catId){
  if(loaded.has(catId)||loading.has(catId)) return;

  /* ── Cache-Check: Gibt es noch gültige Daten dieser Woche? ── */
  const key        = getRefreshKey();
  const cachedKey  = localStorage.getItem("pbz-wk-"+catId);
  const cachedData = localStorage.getItem("pbz-dt-"+catId);

  if(cachedKey === key && cachedData){
    try{
      const parsed = JSON.parse(cachedData);
      if(Array.isArray(parsed) && parsed.length){
        aiData[catId]=parsed; loaded.add(catId); renderMain(); return;
      }
    }catch(e){}
  }

  /* ── Frischer API-Fetch ── */
  loading.add(catId); renderMain();
  const cat = CATEGORIES.find(c=>c.id===catId);
  const now = new Date();
  const dateStr = now.toLocaleDateString("de-DE",{timeZone:"Europe/Berlin",weekday:"long",day:"2-digit",month:"long",year:"numeric"});

  const prompt = `Du bist Redakteur f\u00FCr "Der Polit-Beipackzettel" (Ausgabe: ${dateStr}). `+
    `Erstelle 5 AKTUELLE Nachrichtenmeldungen der laufenden Woche f\u00FCr die Kategorie: "${cat.label}". `+
    `Keine veralteten oder fiktiven Ereignisse. Jede Meldung als JSON-Objekt mit: `+
    `id (vierstellige Zufallszahl), headline (max 12 W\u00F6rter), teaser (max 2 S\u00E4tze), `+
    `bedeutung (Folgen f\u00FCr die Bev\u00F6lkerung, 1-2 S\u00E4tze), `+
    `quelle (offizielle deutsche Beh\u00F6rde oder Institution), vertrauen (0-100). `+
    `NUR JSON-Array, kein Markdown, keine Erkl\u00E4rungen.`;

  try{
    const res  = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2500,
        messages:[{role:"user",content:prompt}]})
    });
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||"").join("");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    if(Array.isArray(parsed) && parsed.length){
      aiData[catId] = parsed;
      try{
        localStorage.setItem("pbz-wk-"+catId, getRefreshKey());
        localStorage.setItem("pbz-dt-"+catId, JSON.stringify(parsed));
      }catch(e){}
    }
  }catch(e){}

  loading.delete(catId); loaded.add(catId); renderMain();
}

renderMain(); loadCategory("inland");

/* ═══════════════════════════════════════════
   PWA: ICON + MANIFEST + SERVICE WORKER
═══════════════════════════════════════════ */
(function initPWA(){
  /* ── 1. Draw app icon on canvas ── */
  function buildIcon(size){
    const c=document.createElement("canvas");
    c.width=c.height=size; const ctx=c.getContext("2d");
    const r=size*0.18;

    // Background – rounded square
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(size-r,0);
    ctx.quadraticCurveTo(size,0,size,r);
    ctx.lineTo(size,size-r);
    ctx.quadraticCurveTo(size,size,size-r,size);
    ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
    ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath();
    ctx.fillStyle="#0a0a08"; ctx.fill();

    // Subtle inner glow ring
    const grd=ctx.createRadialGradient(size/2,size/2,size*0.1,size/2,size/2,size*0.62);
    grd.addColorStop(0,"rgba(45,212,160,0.10)");
    grd.addColorStop(1,"rgba(45,212,160,0)");
    ctx.fillStyle=grd; ctx.fill();

    // Pill shape (capsule)
    const pw=size*0.54, ph=size*0.22, px=(size-pw)/2, py=size*0.28;
    const pr=ph/2;
    ctx.beginPath();
    ctx.moveTo(px+pr,py); ctx.lineTo(px+pw-pr,py);
    ctx.arcTo(px+pw,py,px+pw,py+ph,pr);
    ctx.lineTo(px+pw,py+ph-pr);
    ctx.arcTo(px+pw,py+ph,px+pw-pr,py+ph,pr);
    ctx.lineTo(px+pr,py+ph);
    ctx.arcTo(px,py+ph,px,py+ph-pr,pr);
    ctx.lineTo(px,py+pr);
    ctx.arcTo(px,py,px+pr,py,pr);
    ctx.closePath();
    ctx.strokeStyle="#2dd4a0"; ctx.lineWidth=size*0.025; ctx.stroke();

    // Divider line in center of pill
    ctx.beginPath();
    ctx.moveTo(size/2, py+size*0.02);
    ctx.lineTo(size/2, py+ph-size*0.02);
    ctx.strokeStyle="#2dd4a0"; ctx.lineWidth=size*0.018; ctx.stroke();

    // "P" left, "B" right inside pill
    ctx.fillStyle="#2dd4a0";
    ctx.font=`700 ${size*0.13}px 'Space Mono',monospace`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("P", size/2 - size*0.12, py+ph/2);
    ctx.fillText("B", size/2 + size*0.12, py+ph/2);

    // "BEIPACKZETTEL" label below pill
    ctx.fillStyle="#2dd4a0";
    ctx.font=`${size*0.065}px 'Space Mono',monospace`;
    ctx.globalAlpha=0.7;
    ctx.fillText("BEIPACKZETTEL", size/2, py+ph+size*0.13);
    ctx.globalAlpha=1;

    return c.toDataURL("image/png");
  }

  /* ── 4. Service Worker – Pflicht für PWA-Update-Kontrolle ── */
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      // Neue SW-Version gefunden (neues HTML-Deploy) → Banner anzeigen
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        nw.addEventListener("statechange", ()=>{
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
      // Nach Nutzer-Klick auf "JETZT LADEN": neuen SW sofort aktivieren
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{
        if(!window._pbzReloading){ window._pbzReloading = true; location.reload(); }
      });
    }).catch(()=>{ /* sw.js nicht vorhanden – ETag-Fallback bleibt aktiv */ });
  }

})();

/* ═══════════════════════════════════════════
   PERIODISCHER CHECK – greift auch wenn App
   dauerhaft geöffnet bleibt (alle 30 Min).
═══════════════════════════════════════════ */
setInterval(()=>{
  if(!navigator.onLine) return;
  checkForUpdate();
  if(document.visibilityState === "visible"){
    const didRefresh = enforceWeeklyRefresh();
    if(didRefresh){ renderMain(); loadCategory(activeTab); }
  }
}, 30 * 60 * 1000);
</script>
