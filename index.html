<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPA Tourenplan - Offline Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .service-grid { display: grid; grid-template-columns: repeat(var(--service-count), minmax(20px, 1fr)); gap: 2px; align-items: center; justify-items: center; }
        [draggable="true"] { cursor: move; }
    </style>
</head>
<body class="bg-gray-100 p-5">

    <nav class="mb-6 flex gap-2">
        <button onclick="showTab('plan')" class="bg-teal-800 text-white px-4 py-2 rounded">Tourenplan</button>
        <button onclick="showTab('clients')" class="bg-teal-800 text-white px-4 py-2 rounded">Klientenliste</button>
        <button onclick="showTab('services')" class="bg-teal-800 text-white px-4 py-2 rounded">Leistungen</button>
    </nav>

    <div id="plan" class="tab-content active">
        <button onclick="exportPDF()" class="bg-blue-600 text-white px-3 py-1 text-sm rounded mb-4">PDF Export</button>
        <div id="print-area" class="bg-white p-2">
            <table class="w-full border-collapse border text-[10px]" id="tour-table" style="--service-count: 8;">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="clients" class="tab-content">
        <input type="text" id="client-input" class="border p-2" placeholder="Name">
        <button onclick="addItem('clients')" class="bg-green-700 text-white p-2">Hinzufügen</button>
        <ul id="client-list" class="mt-4"></ul>
    </div>

    <div id="services" class="tab-content">
        <input type="text" id="service-input" class="border p-2" placeholder="Kürzel">
        <button onclick="addItem('services')" class="bg-green-700 text-white p-2">Hinzufügen</button>
        <ul id="service-list" class="mt-4"></ul>
    </div>

    <script>
        // 1. Laden des States aus localStorage
        let state = JSON.parse(localStorage.getItem('gpa-data')) || { 
            clients: [], 
            services: ['KP', 'GP', 'VW', 'KS', 'BZ', 'Tbl', 'Medi', 'UHbA'] 
        };

        function saveState() {
            localStorage.setItem('gpa-data', JSON.stringify(state));
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function addItem(type) {
            const input = document.getElementById(type === 'clients' ? 'client-input' : 'service-input');
            if(input.value) {
                type === 'clients' ? state.clients.push(input.value) : state.services.push(input.value);
                input.value = '';
                saveState();
                renderAll();
            }
        }

        function removeItem(type, idx) {
            type === 'clients' ? state.clients.splice(idx, 1) : state.services.splice(idx, 1);
            saveState();
            renderAll();
        }

        function renderAll() {
            document.getElementById('tour-table').style.setProperty('--service-count', state.services.length);

            // Header Render
            const head = document.getElementById('table-head');
            head.innerHTML = `<tr><th class="border p-1">Zeit</th>` + ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `
                <th class="border p-1">${d}<div class="service-grid">${state.services.map(s => `<span>${s}</span>`).join('')}</div></th>`).join('') + `</tr>`;
            
            // Body Render
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            for (let i = 6; i <= 13; i++) {
                const tr = document.createElement('tr');
                tr.draggable = true;
                tr.innerHTML = `<td class="border p-2 font-bold">${i}:00</td>` + Array(7).fill(0).map(() => `
                    <td class="border p-1">
                        <select class="w-full border mb-1"><option>Klient...</option>${state.clients.map(c => `<option>${c}</option>`).join('')}</select>
                        <div class="service-grid">${state.services.map(() => `<input type="checkbox" class="w-3 h-3">`).join('')}</div>
                    </td>`).join('');
                
                tr.ondragstart = (e) => e.dataTransfer.setData('text/plain', i);
                tr.ondrop = (e) => { e.preventDefault(); tbody.insertBefore(tr, tbody.children[0]); }; // Logik für Drag
                tr.ondragover = (e) => e.preventDefault();
                tbody.appendChild(tr);
            }
            
            document.getElementById('client-list').innerHTML = state.clients.map((c, i) => `<li>${c} <button onclick="removeItem('clients', ${i})" class="text-red-500 ml-2">x</button></li>`).join('');
            document.getElementById('service-list').innerHTML = state.services.map((s, i) => `<li>${s} <button onclick="removeItem('services', ${i})" class="text-red-500 ml-2">x</button></li>`).join('');
        }

        function exportPDF() {
            html2pdf().set({ jsPDF: { orientation: 'landscape', format: 'a4' } }).from(document.getElementById('print-area')).save();
        }

        renderAll();
    </script>
</body>
</html>
</body>
