<title>CareShield — Testversion (ohne Anmeldung) · YNA Digital</title>

<style>
  :root{
    color-scheme:light;
    --dust-grey:#d7d0c8; --bone:#c8c6af; --muted-teal:#95a78d; --rosy-taupe:#bd897e; --vibrant-coral:#f87666;
    --coral-700:#d01f09; --teal-700:#5b6c53; --taupe-700:#814d42;
    --ink:#1f2421; --paper:#ffffff; --cream:#faf8f4; --line:#e7e3dc; --text-muted:#5b6157;
    --link:var(--teal-700);
    --font-display:'Sora',system-ui,Segoe UI,Roboto,sans-serif;
    --font-body:'Inter',system-ui,Segoe UI,Roboto,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --radius:16px; --radius-sm:10px;
    --focus:0 0 0 3px #faf8f4,0 0 0 6px var(--teal-700);
    --shadow:0 1px 2px rgba(31,36,33,.05),0 10px 34px -20px rgba(31,36,33,.28);
    --fs:1; /* Schriftgrößen-Skalierung */
  }
  *{box-sizing:border-box}
  html{background:#faf8f4}
  body{margin:0;background:#faf8f4;color:#1f2421;font-family:var(--font-body);font-size:calc(16px * var(--fs));line-height:1.62;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-display);line-height:1.18;letter-spacing:-.01em;margin:0}
  p{margin:0 0 12px}
  a{color:var(--link)}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
  .gradient-rule{height:5px;border:0;margin:0;background:linear-gradient(90deg,var(--dust-grey),var(--bone),var(--muted-teal),var(--rosy-taupe),var(--vibrant-coral))}
  .skip{position:absolute;left:-999px;top:8px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:8px;z-index:200}
  .skip:focus{left:12px}

  /* App-Leiste */
  header.appbar{position:sticky;top:0;z-index:60;background:#faf8f4ee;backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
  .appbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:calc(16px * var(--fs))}
  .brand .sub{color:var(--teal-700);font-weight:500}
  .ab-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;min-width:40px;min-height:40px;cursor:pointer;font-size:13px;font-family:var(--font-mono);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
  .icon-btn:hover{background:#95a78d18}
  .crisis-chip{border:1px solid var(--rosy-taupe);background:#bd897e1a;color:var(--taupe-700);font-weight:600;font-family:var(--font-body)}
  .test-strip{background:#f876661a;border-top:1px solid #f8766644;color:var(--coral-700);font-family:var(--font-mono);font-size:calc(11px * var(--fs));text-align:center;padding:5px 10px;line-height:1.35}

  main#app{max-width:760px;margin:0 auto;padding:18px 16px 96px;font-size:calc(16px * var(--fs))}
  .eyebrow{font-family:var(--font-mono);font-size:calc(11px * var(--fs));letter-spacing:.13em;text-transform:uppercase;color:var(--teal-700);margin-bottom:8px}
  .muted{color:var(--text-muted)}
  h1.page{font-size:calc(26px * var(--fs));margin:6px 0 6px}
  h2.sec{font-size:calc(20px * var(--fs));margin:22px 0 10px}

  /* Karten */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card.soft{background:#faf8f4;box-shadow:none}
  .card h3{font-size:calc(17px * var(--fs));margin-bottom:6px}
  .accent-l{border-left:5px solid var(--vibrant-coral)}
  .accent-t{border-left:5px solid var(--muted-teal)}

  /* Buttons */
  .btn{font-weight:600;font-size:calc(15px * var(--fs));border-radius:var(--radius-sm);padding:12px 18px;border:1.5px solid transparent;cursor:pointer;min-height:48px}
  .btn-primary{background:var(--vibrant-coral);color:var(--ink);width:100%}
  .btn-secondary{background:transparent;color:var(--teal-700);border-color:var(--muted-teal)}
  .btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--line)}
  .btn-danger{background:transparent;color:var(--coral-700);border-color:var(--rosy-taupe)}
  .btn-block{width:100%}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

  label{display:block;font-size:calc(14px * var(--fs));font-weight:600;margin:14px 0 6px}
  label .opt{color:var(--text-muted);font-weight:400}
  input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;background:#fff;resize:vertical}
  textarea{min-height:84px}
  input[type=range]{width:100%;accent-color:var(--teal-700);height:30px}
  .range-row{display:flex;align-items:center;gap:12px}
  .range-row output{font-family:var(--font-mono);min-width:26px;text-align:right;font-size:calc(15px * var(--fs))}
  .scale-help{display:flex;justify-content:space-between;font-size:calc(12px * var(--fs));color:var(--text-muted);margin-top:2px}

  .alert{border-radius:var(--radius-sm);padding:12px 14px;font-size:calc(14px * var(--fs));margin-top:14px;border:1px solid var(--line)}
  .alert-ok{border-color:var(--muted-teal);background:#95a78d18;color:var(--teal-700)}
  .alert-err{border-color:var(--vibrant-coral);background:#f876661a;color:var(--coral-700)}
  .alert-care{border-color:var(--rosy-taupe);background:#bd897e1a;color:var(--taupe-700)}

  /* Onboarding */
  .ob{min-height:78vh;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto}
  .ob .dots{display:flex;gap:7px;justify-content:center;margin:18px 0}
  .ob .dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
  .ob .dots i.on{background:var(--vibrant-coral)}
  .ob-illu{width:74px;height:74px;border-radius:99px;background:radial-gradient(circle at 35% 30%,var(--bone),var(--muted-teal));display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:calc(15px * var(--fs));font-weight:600}
  .choice:hover{border-color:var(--muted-teal)}
  .choice.sel{border-color:var(--vibrant-coral);background:#f876660f}
  .recovery-code{font-family:var(--font-mono);font-size:calc(17px * var(--fs));background:var(--ink);color:#d7f0d0;padding:14px;border-radius:var(--radius-sm);text-align:center;letter-spacing:.08em;word-break:break-all;margin:8px 0}

  /* Dashboard */
  .hello{font-size:calc(24px * var(--fs));font-family:var(--font-display);font-weight:700}
  .mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .ms{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;text-align:center}
  .ms b{display:block;font-family:var(--font-mono);font-size:calc(20px * var(--fs));color:var(--teal-700)}
  .ms span{font-size:calc(11px * var(--fs));color:var(--text-muted)}

  .module-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mtile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:128px;box-shadow:var(--shadow)}
  .mtile:hover{border-color:var(--muted-teal)}
  .mbadge{width:32px;height:32px;border-radius:99px;background:var(--muted-teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600}
  .mtile h3{font-size:calc(15px * var(--fs))}
  .mtile p{font-size:calc(12.5px * var(--fs));color:var(--text-muted);margin:0}
  .ptrack{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
  .pfill{height:100%;background:var(--vibrant-coral)}

  /* Lektionen */
  .lesson p{font-size:calc(15.5px * var(--fs))}
  .lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
  .step-meter{font-family:var(--font-mono);font-size:calc(12px * var(--fs));color:var(--text-muted)}
  .pill{display:inline-block;font-family:var(--font-mono);font-size:calc(11px * var(--fs));padding:2px 9px;border-radius:99px;background:#95a78d26;color:var(--teal-700)}
  ul.ticks{list-style:none;padding:0;margin:8px 0}
  ul.ticks li{position:relative;padding:6px 0 6px 26px;font-size:calc(15px * var(--fs))}
  ul.ticks li::before{content:"›";position:absolute;left:6px;top:5px;color:var(--vibrant-coral);font-weight:700}

  details.entry{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;margin-top:8px;background:#faf8f4}
  details.entry summary{cursor:pointer;font-weight:600;font-size:calc(14px * var(--fs))}
  details.entry .row{margin-top:8px}
  details.entry .row b{display:block;font-size:calc(11.5px * var(--fs));text-transform:uppercase;letter-spacing:.04em;color:var(--teal-700)}

  /* Atemübung */
  .breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0}
  .breath-circle{width:148px;height:148px;border-radius:99px;background:radial-gradient(circle at 35% 30%,var(--muted-teal),var(--teal-700));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);text-align:center;font-size:calc(14px * var(--fs))}
  @media (prefers-reduced-motion: no-preference){ .breath-circle.go{animation:br 8s ease-in-out infinite} }
  @keyframes br{0%{transform:scale(1)}50%{transform:scale(1.34)}100%{transform:scale(1)}}

  svg.chart{width:100%;height:190px;overflow:visible}
  .legend{display:flex;gap:16px;font-size:calc(12.5px * var(--fs));margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:99px}

  .res{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;margin-bottom:10px}
  .res .rt{font-weight:700;font-size:calc(15px * var(--fs))}
  .res .num{font-family:var(--font-mono);font-size:calc(16px * var(--fs));color:var(--coral-700);font-weight:500}
  .res .meta{font-size:calc(12.5px * var(--fs));color:var(--text-muted)}
  .res a.call{margin-left:auto;align-self:center;white-space:nowrap}

  .kv{font-family:var(--font-mono);font-size:calc(12px * var(--fs));background:#faf8f4;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:280px}

  /* Untere Navigation */
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fffffff2;backdrop-filter:saturate(140%) blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center}
  .tabbar-in{max-width:760px;width:100%;display:flex}
  .tab{flex:1;background:none;border:0;cursor:pointer;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-size:calc(11px * var(--fs));font-weight:600;min-height:58px}
  .tab svg{width:22px;height:22px}
  .tab[aria-current=true]{color:var(--coral-700)}
  .tab[aria-current=true] svg{stroke:var(--coral-700)}

  .center-screen{min-height:78vh;display:flex;align-items:center;justify-content:center}
  .auth{max-width:420px;width:100%}
  .link-btn{background:none;border:0;color:var(--link);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;font-size:calc(14px * var(--fs))}
  .disclaimer{font-size:calc(12px * var(--fs));color:var(--text-muted);margin-top:8px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (prefers-color-scheme:dark){:root{color-scheme:light}html,body,main{background:#faf8f4!important;color:#1f2421!important}}
</style>
</head>

<script type="module">
"use strict";

/* =====================================================================
   CareShield — vollständige Endnutzer-App (self-contained, offline-fähig)
   Zero-Knowledge: sensible Inhalte werden ausschließlich clientseitig
   verschlüsselt; diese Seite sendet keine Daten an einen Server.
   ===================================================================== */

/* ---------- Konstanten ---------- */
const NONCE_BYTES = 12, TAG_BITS = 128, DEK_BYTES = 32, SALT_BYTES = 16, RECOVERY_BYTES = 32;
const PBKDF2_ITERATIONS = 600000; // OWASP Password Storage Cheat Sheet (Stand Dez. 2022/2025)
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const FONT_STEPS = [1, 1.15, 1.32];
/* TESTVERSION: feste Demo-Passphrase. Diese Kopie überspringt Einrichtung und
   Entsperren. Das ist KEIN Zero-Knowledge mehr — wer diesen Quelltext liest,
   kennt den Schlüssel. Nur zum Funktionstest ohne Anmeldung. Die echte,
   passphrase-geschützte Version ist careshield-app.html. */
const DEMO_PASSPHRASE = 'CareShield-Testversion-ohne-Anmeldung-2026';

/* ---------- Inhalte (evidenzorientiertes Coping-Programm) ---------- */
const MODULES = [
  {
    id: 'psychoeducation', letter: 'A', title: 'Demenz verstehen', sub: 'Wissen, das entlastet',
    intro: 'Vieles wird leichter, wenn man versteht, was im Gehirn passiert — und was nicht Ihre Schuld ist.',
    lessons: [
      { title: 'Was bei Demenz geschieht', body: [
        'Demenz verändert, wie das Gehirn Erinnerungen bildet und abruft, wie Worte gefunden und Handlungen geplant werden. Es ist eine körperliche Erkrankung des Gehirns — kein Charakterfehler und kein Nachlassen des Willens.',
        'Das hat eine wichtige Folge: Schwieriges Verhalten ist fast immer Ausdruck dieser Veränderung, nicht Absicht. Wer das verinnerlicht, nimmt vieles weniger persönlich — und das schützt Ihre eigenen Kräfte.' ] },
      { title: 'Gute und schlechte Tage', body: [
        'Der Verlauf schwankt. An einem Tag gelingt vieles, am nächsten fast nichts — oft ohne erkennbaren Grund. Das ist normal und kein Rückschritt, den Sie verursacht haben.',
        'Hilfreich ist, Erwartungen an den Tag anzupassen statt an ein festes Ziel. Was gestern ging, muss heute nicht gehen — und umgekehrt.' ] },
      { title: 'Was Erinnern und Vergessen bedeuten', body: [
        'Menschen mit Demenz verlieren oft zuerst das Kurzzeitgedächtnis, während Gefühle und alte Erinnerungen lange bleiben. Eine Frage zum dritten Mal zu beantworten ist anstrengend — aber für Ihr Gegenüber ist es jedes Mal das erste Mal.',
        'Gegen Erinnerungen anzukämpfen („Das habe ich dir doch gerade gesagt") erzeugt meist nur Stress auf beiden Seiten. Ruhig und kurz zu antworten, kostet langfristig weniger Kraft.' ] },
      { title: 'Was Sie beeinflussen können', body: [
        'Sie können die Erkrankung nicht aufhalten. Aber Sie können drei Dinge gestalten: Ihre eigene Reaktion, die Umgebung und den Tagesablauf. Genau hier setzen die nächsten Module an.',
        'Realistische Ziele sind selten „Verbesserung", sondern Wohlbefinden im Moment und ein möglichst ruhiger Alltag. Kleine, gute Momente zählen — auch wenn sie sich nicht groß anfühlen.' ] },
      { title: 'Ihre eigene Gesundheit zählt mit', body: [
        'Pflegende Angehörige tragen oft sehr lange sehr viel. Erschöpfung, gedrückte Stimmung und Gereiztheit sind keine Schwäche, sondern verständliche Reaktionen auf Dauerbelastung.',
        'Für die Person, die Sie begleiten, ist Ihre Stabilität die wichtigste Ressource. Sich selbst zu entlasten ist deshalb kein Egoismus, sondern Teil guter Pflege. Die folgenden Module sind genau dafür da.' ] },
    ], tool: null,
  },
  {
    id: 'cognitive-restructuring', letter: 'B', title: 'Gedanken umlenken', sub: 'Belastende Gedanken einordnen',
    intro: 'Ein belastender Gedanke fühlt sich wahr an — ist aber selten die einzig mögliche Sichtweise.',
    lessons: [
      { title: 'Gedanken sind nicht Tatsachen', body: [
        'In angespannten Momenten schießen automatische Gedanken durch den Kopf: „Ich versage", „Ich halte das nicht aus", „Ich bin eine schlechte Tochter". Sie fühlen sich wie Fakten an — sind aber Bewertungen.',
        'Solche Gedanken verstärken Stress und Schuldgefühle. Der erste Schritt ist, sie überhaupt zu bemerken, statt ihnen ungeprüft zu glauben.' ] },
      { title: 'Eine zweite, ebenso wahre Sichtweise', body: [
        'Nicht „positiv denken", sondern fair denken: Gibt es eine andere Sichtweise, die genauso wahr ist? Aus „Ich mache alles falsch" kann werden: „Ich tue unter sehr schweren Bedingungen mein Bestes."',
        'Diese alternative Sichtweise muss glaubwürdig sein, nicht schöngefärbt. Mit Übung fällt sie im Alltag schneller ein.' ] },
      { title: 'So nutzen Sie das Gedanken-Werkzeug', body: [
        'Im Werkzeug unten halten Sie einen belastenden Moment fest: Was ist passiert, welcher Gedanke kam sofort, und welche andere Sichtweise wäre ebenso wahr? Sie bewerten Ihre Stimmung davor und danach.',
        'Schon das Aufschreiben schafft Abstand. Über Wochen sehen Sie, welche Gedanken wiederkehren — und welche Gegengedanken Ihnen helfen.' ] },
    ], tool: 'thought',
  },
  {
    id: 'behavior-management', letter: 'C', title: 'Verhalten verstehen', sub: 'Herausforderndes Verhalten begleiten',
    intro: 'Schwieriges Verhalten ist oft eine Botschaft: ein Bedürfnis, das sich nicht anders ausdrücken kann.',
    lessons: [
      { title: 'Verhalten als Kommunikation', body: [
        'Unruhe, Wiederholungen, Abwehr bei der Körperpflege, nächtliches Aufstehen — solches Verhalten hat fast immer einen Auslöser: Schmerz, Angst, Überforderung, Hunger, Langeweile oder zu viele Reize.',
        'Die Frage „Was will mir dieses Verhalten sagen?" führt weiter als „Wie stelle ich es ab?". Oft verschwindet das Verhalten, wenn das Bedürfnis dahinter erkannt ist.' ] },
      { title: 'Das ABC-Muster', body: [
        'A — Auslöser (was war unmittelbar davor?), B — Verhalten (was geschah konkret?), C — Folge (wie haben Sie reagiert, was passierte danach?). Dieses einfache Muster macht Zusammenhänge sichtbar.',
        'Wenn Sie mehrere Situationen festhalten, erkennen Sie Muster: Bestimmte Tageszeiten, Orte oder Reize tauchen immer wieder auf — und lassen sich gezielt verändern.' ] },

/* ---------- Byte-Helfer ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
function b64e(bytes){ let s=''; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function b64d(s){ const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function b32e(bytes){ let bits=0,val=0,out=''; for(const byte of bytes){ val=(val<<8)|byte; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } } if(bits>0) out+=B32[(val<<(5-bits))&31]; return out; }
function fmtRecovery(c){ const g=[]; for(let i=0;i<c.length;i+=4) g.push(c.slice(i,i+4)); return g.join('-'); }
function normRecovery(s){ return s.replace(/[\s-]/g,'').toUpperCase(); }
function newId(){ if(crypto.randomUUID) return crypto.randomUUID(); const b=crypto.getRandomValues(new Uint8Array(16)); return Array.from(b,(x)=>x.toString(16).padStart(2,'0')).join(''); }
function nowIso(){ return new Date().toISOString(); }

/* ---------- Zero-Knowledge-Krypto (WebCrypto) ---------- */
async function deriveKek(passphrase, salt, iterations=PBKDF2_ITERATIONS){
  const base = await crypto.subtle.importKey('raw', enc.encode(passphrase), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations, hash:'SHA-256'}, base, 256);
  return new Uint8Array(bits);
}
async function encryptField(key, plaintext, aad){
  const nonce = crypto.getRandomValues(new Uint8Array(NONCE_BYTES));
  const ck = await crypto.subtle.importKey('raw', key, {name:'AES-GCM'}, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:nonce, additionalData:enc.encode(aad), tagLength:TAG_BITS}, ck, enc.encode(plaintext));
  const full = new Uint8Array(ct); const off = full.byteLength - TAG_BITS/8;
  return { v:1, alg:'AES-256-GCM', nonceB64:b64e(nonce), ctB64:b64e(full.slice(0,off)), tagB64:b64e(full.slice(off)), aad };
}
async function decryptField(key, env){
  if(env.v!==1 || env.alg!=='AES-256-GCM') throw new RangeError('Unbekanntes Envelope');
  const ck = await crypto.subtle.importKey('raw', key, {name:'AES-GCM'}, false, ['decrypt']);
  const nonce=b64d(env.nonceB64), ctv=b64d(env.ctB64), tag=b64d(env.tagB64);
  const comb=new Uint8Array(ctv.length+tag.length); comb.set(ctv,0); comb.set(tag,ctv.length);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:nonce, additionalData:enc.encode(env.aad), tagLength:TAG_BITS}, ck, comb);
  return dec.decode(pt);
}
async function createKeystore(passphrase){
  const dek=crypto.getRandomValues(new Uint8Array(DEK_BYTES));
  const pSalt=crypto.getRandomValues(new Uint8Array(SALT_BYTES));
  const rSalt=crypto.getRandomValues(new Uint8Array(SALT_BYTES));
  const rBytes=crypto.getRandomValues(new Uint8Array(RECOVERY_BYTES));
  const recoveryDisplay=fmtRecovery(b32e(rBytes));
  const pKek=await deriveKek(passphrase, pSalt);
  const rKek=await deriveKek(normRecovery(recoveryDisplay), rSalt);
  const wrappedDek=await encryptField(pKek, b64e(dek), 'dek:v1');
  const wrappedRec=await encryptField(rKek, b64e(dek), 'dek:v1:recovery');
  const record={ v:1, kdf:{name:'PBKDF2-SHA256', iterations:PBKDF2_ITERATIONS, saltB64:b64e(pSalt)}, wrappedDek, recovery:{saltB64:b64e(rSalt), wrappedDek:wrappedRec}, updatedAt:nowIso() };
  return { record, recoveryDisplay, dek };
}
async function unlockPassphrase(record, passphrase){
  const kek=await deriveKek(passphrase, b64d(record.kdf.saltB64), record.kdf.iterations);
  return b64d(await decryptField(kek, record.wrappedDek));
}
async function unlockRecovery(record, codeInput){
  const kek=await deriveKek(normRecovery(codeInput), b64d(record.recovery.saltB64), record.kdf.iterations);
  return b64d(await decryptField(kek, record.recovery.wrappedDek));
}
async function resetWithRecovery(record, codeInput, newPass){
  const dek=await unlockRecovery(record, codeInput);
  const ns=crypto.getRandomValues(new Uint8Array(SALT_BYTES));
  const nk=await deriveKek(newPass, ns, record.kdf.iterations);
  const wrappedDek=await encryptField(nk, b64e(dek), 'dek:v1');
  return { record:{...record, kdf:{...record.kdf, saltB64:b64e(ns)}, wrappedDek, updatedAt:nowIso()}, dek };
}
async function rotatePassphrase(record, cur, next){
  const dek=await unlockPassphrase(record, cur);
  const ns=crypto.getRandomValues(new Uint8Array(SALT_BYTES));
  const nk=await deriveKek(next, ns);
  const wrappedDek=await encryptField(nk, b64e(dek), 'dek:v1');
  return { record:{...record, kdf:{...record.kdf, saltB64:b64e(ns)}, wrappedDek, updatedAt:nowIso()}, dek };
}

/* ---------- Speicher-Adapter (deploymentfähig) ----------
   Reihenfolge: window.storage (Artefakt-Vorschau) → IndexedDB (echte
   Homepage/native WebView) → In-Memory (Notfall, nur Sitzung). So läuft
   dieselbe Datei in der Vorschau UND nach Veröffentlichung. localStorage wird
   bewusst nicht verwendet. */
const Store = (() => {
  if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
    return {
      kind: 'window.storage',
      set: (k, v) => window.storage.set(k, v, false),
      get: (k) => window.storage.get(k, false),
      del: (k) => window.storage.delete(k, false),
      list: (p) => window.storage.list(p, false),
    };
  }
  if (typeof indexedDB !== 'undefined') {
    const DBN = 'careshield-store', VER = 1, ST = 'kv';
    let dbp = null;
    const db = () => {
      if (!dbp) dbp = new Promise((res, rej) => {
        const r = indexedDB.open(DBN, VER);
        r.onupgradeneeded = () => { r.result.createObjectStore(ST); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      return dbp;
    };
    const op = (mode, fn) => db().then((d) => new Promise((res, rej) => {
      const tx = d.transaction(ST, mode);
      const rq = fn(tx.objectStore(ST));
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }));
    return {
      kind: 'indexeddb',
      async set(k, v) { await op('readwrite', (s) => s.put(v, k)); return {}; },
      async get(k) { const v = await op('readonly', (s) => s.get(k)); return v === undefined ? null : { value: v }; },
      async del(k) { await op('readwrite', (s) => s.delete(k)); return {}; },
      async list(p) { const keys = await op('readonly', (s) => s.getAllKeys()); return { keys: (keys || []).filter((k) => !p || String(k).startsWith(p)) }; },
    };
  }
  const mem = new Map();
  return {
    kind: 'memory',
    async set(k, v) { mem.set(k, v); return {}; },
    async get(k) { return mem.has(k) ? { value: mem.get(k) } : null; },
    async del(k) { mem.delete(k); return {}; },
    async list(p) { return { keys: [...mem.keys()].filter((k) => !p || k.startsWith(p)) }; },
  };
})();

async function sSet(k,o){ try{ await Store.set(k, JSON.stringify(o)); return true; }catch(e){ console.error('store',k,e); return null; } }
async function sGet(k){ try{ const r=await Store.get(k); return r&&r.value!=null?JSON.parse(r.value):null; }catch(e){ return null; } }
async function sDel(k){ try{ await Store.del(k); }catch(e){} }
async function sList(p){ try{ const r=await Store.list(p); return r&&r.keys?r.keys:[]; }catch(e){ return []; } }

/* ---------- Verschlüsselte Einträge ---------- */
async function saveEntry(type, payload){
  const id=newId(); const env=await encryptField(state.dek, JSON.stringify(payload), `${type}:v1:${id}`);
  await sSet(`entry:${type}:${id}`, env);
  const idx=(await sGet(`index:${type}`))||[]; idx.push({id, at:payload.at}); await sSet(`index:${type}`, idx);
  return id;
}
async function listEntries(type){ const idx=(await sGet(`index:${type}`))||[]; return idx.slice().sort((a,b)=>(a.at<b.at?1:-1)); }
async function loadEntry(type,id){ const env=await sGet(`entry:${type}:${id}`); if(!env) return null; return { payload:JSON.parse(await decryptField(state.dek, env)), env }; }

async function loadProfile(){ const env=await sGet('meta:profile'); if(!env){ state.profile=null; return; } try{ state.profile=JSON.parse(await decryptField(state.dek, env)); }catch(e){ state.profile=null; } }

/* ---------- FHIR-R4-Export (clientseitig, §7) ---------- */
const LOCAL_CODE_SYS='https://yna.digital/fhir/careshield-codes';
function buildFhirBundle(checkins, thoughts){
  const entries=[];
  entries.push({ resource:{ resourceType:'RelatedPerson', id:'caregiver-local', patient:{reference:'Patient/care-recipient-local'} } });
  for(const c of checkins){
    entries.push({ resource:{ resourceType:'Observation', id:`mood-${c.id}`, status:'final',
      code:{ coding:[{system:LOCAL_CODE_SYS, code:'self-mood', display:'CareShield Selbsteinschätzung Stimmung (0–10, nicht validiert)'}] },
      subject:{reference:'RelatedPerson/caregiver-local'}, effectiveDateTime:c.at, valueQuantity:{value:c.mood, unit:'score', system:'http://unitsofmeasure.org', code:'{score}'} } });
    entries.push({ resource:{ resourceType:'Observation', id:`stress-${c.id}`, status:'final',
      code:{ coding:[{system:LOCAL_CODE_SYS, code:'self-stress', display:'CareShield Selbsteinschätzung Belastung (0–10, nicht validiert)'}] },
      subject:{reference:'RelatedPerson/caregiver-local'}, effectiveDateTime:c.at, valueQuantity:{value:c.stress, unit:'score', system:'http://unitsofmeasure.org', code:'{score}'} } });
  }
  for(const t of thoughts){
    entries.push({ resource:{ resourceType:'QuestionnaireResponse', id:`thought-${t.id}`, status:'completed', authored:t.at,
      source:{reference:'RelatedPerson/caregiver-local'}, item:[
        {linkId:'trigger', text:'Auslöser', answer:[{valueString:t.trigger}]},
        {linkId:'automatic', text:'Erster Gedanke', answer:[{valueString:t.automatic}]},
        {linkId:'alternative', text:'Andere Sichtweise', answer:[{valueString:t.alternative}]},
        {linkId:'mood-before', text:'Stimmung vorher', answer:[{valueInteger:t.before}]},
        {linkId:'mood-after', text:'Stimmung nachher', answer:[{valueInteger:t.after}]},
      ] } });
  }
  return { resourceType:'Bundle', type:'collection', timestamp:nowIso(), entry:entries };
}
function buildHumanSummary(checkins, thoughts){
  const lines=[];
  lines.push('CareShield — Verlaufsübersicht für ein ärztliches oder therapeutisches Gespräch');
  lines.push('Erstellt am: '+new Date().toLocaleString('de-DE'));
  lines.push('Hinweis: Selbsteinschätzungen, kein validiertes klinisches Messinstrument.');
  lines.push('');
  lines.push('STIMMUNG UND BELASTUNG (0 = sehr niedrig/keine, 10 = sehr hoch)');
  if(checkins.length===0){ lines.push('  Noch keine Einträge.'); }
  else{
    const recent=checkins.slice(0,14).slice().reverse();
    for(const c of recent){ lines.push('  '+new Date(c.at).toLocaleDateString('de-DE')+': Stimmung '+c.mood+' / Belastung '+c.stress); }
    const avgM=(checkins.reduce((s,c)=>s+c.mood,0)/checkins.length).toFixed(1);
    const avgS=(checkins.reduce((s,c)=>s+c.stress,0)/checkins.length).toFixed(1);
    lines.push('  Durchschnitt ('+checkins.length+' Einträge): Stimmung '+avgM+' / Belastung '+avgS);
  }
  lines.push('');
  lines.push('FESTGEHALTENE BELASTENDE SITUATIONEN: '+thoughts.length);
  lines.push('');
  lines.push('Anzahl bearbeiteter Lernmodule: '+Object.values(state.progress).filter((p)=>p.lessons>=p.total).length+' von '+MODULES.length);
  return lines.join('\n');
}

  state.record = record; state.dek = dek;
  state.progress = defaultProgress(); await saveProgress();

  state.record = await sGet('keystore');

async function entryListHtml(type, render){
  const items=await listEntries(type);

}
function wireEntries(render){
  document.querySelectorAll('details.entry').forEach((el)=>{
    el.addEventListener('toggle', async ()=>{
      if(!el.open) return; const b=el.querySelector('.body'); if(b.dataset.pending!=='1') return;
      const r=await loadEntry(el.dataset.type, el.dataset.id); b.innerHTML=r?render(r.payload):'Konnte nicht geladen werden.'; b.dataset.pending='0';
    });
  });
}

function chartSvg(series){
  const w=700,h=170,pad=22,n=series.length;
  const xs=n>1?(w-pad*2)/(n-1):0; const yF=(v)=>h-pad-(v/10)*(h-pad*2);
  const mp=series.map((e,i)=>`${pad+i*xs},${yF(e.mood)}`).join(' ');
  const sp=series.map((e,i)=>`${pad+i*xs},${yF(e.stress)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Verlauf von Stimmung und Belastung"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e3dc"/><polyline points="${mp}" fill="none" stroke="#5b6c53" stroke-width="2.5"/><polyline points="${sp}" fill="none" stroke="#f87666" stroke-width="2.5"/></svg>`;
}

      <p class="muted" style="font-size:calc(14px * var(--fs))">In dieser Testversion erfolgt die Anmeldung automatisch mit einer festen, im Quelltext sichtbaren Demo-Passphrase — die Verschlüsselung schützt hier also nicht wirklich. Technisch werden Inhalte mit AES-256-GCM verschlüsselt; der Schlüssel wird per PBKDF2-SHA256 (${PBKDF2_ITERATIONS.toLocaleString('de-DE')} Iterationen) abgeleitet, in der nativen Produktversion per Argon2id. Es werden keine Daten an einen Server gesendet.</p>
      <button class="btn btn-ghost" data-action="show-keystore">Verschlüsselungs-Details zeigen</button>
      <div id="keystore-out"></div>
    </div>

    <div class="card">
      <h3>Testdaten zurücksetzen</h3>
      <p class="muted" style="font-size:calc(14px * var(--fs))">Entfernt Schlüssel und alle Einträge und meldet danach automatisch erneut an. Nur für Test- und Vorführzwecke.</p>
      <div class="btn-row"><button class="btn btn-danger" data-action="wipe">Alles zurücksetzen</button></div>
    </div>
    ${statusHtml()}
    <p class="disclaimer">CareShield ist ein Selbsthilfe- und Lernangebot (Prototyp). Es ist keine zugelassene digitale Pflegeanwendung und ersetzt keine ärztliche oder therapeutische Behandlung.</p>`;
}

/* ---------- Klick-Delegation ---------- */
document.addEventListener('click', async (e)=>{
  const t=e.target.closest('[data-action]'); if(!t) return; const a=t.dataset.action;
  if(a==='goto'){ state.sub=t.dataset.view; setStatus(null); render(); window.scrollTo(0,0); return; }
  if(a==='cycle-font'){ state.fontStep=(state.fontStep+1)%FONT_STEPS.length; applyFont(); if(state.sub==='mehr') renderMehr(); return; }
  if(a==='ob-next'){ if(state.onboard.step<3){ state.onboard.step++; setStatus(null); renderOnboarding(); } return; }
  if(a==='ob-back'){ if(state.onboard.step>0){ state.onboard.step--; setStatus(null); renderOnboarding(); } return; }
  if(a==='ob-situation'){ state.onboard.situation=t.dataset.v; renderOnboarding(); return; }
  if(a==='recovery-done'){ const ack=document.getElementById('recack'); if(ack && !ack.checked){ alert('Bitte bestätigen Sie, dass Sie den Recovery-Code notiert haben.'); return; } state.view='app'; state.sub='start'; setStatus(null); render(); return; }
  if(a==='show-recovery'){ state.sub='recovery'; render(); return; }
  if(a==='show-pass'){ state.sub=null; render(); return; }
  if(a==='lesson-next'){ lessonIndex++; renderModule(state.sub.slice(4)); window.scrollTo(0,0); return; }
  if(a==='lesson-prev'){ lessonIndex--; renderModule(state.sub.slice(4)); window.scrollTo(0,0); return; }
  if(a==='export-human'){ await doExport('human'); return; }
  if(a==='export-fhir'){ await doExport('fhir'); return; }
  if(a==='show-keystore'){ document.getElementById('keystore-out').innerHTML=`<div class="kv">${esc(JSON.stringify(state.record,null,2))}</div>`; return; }
  if(a==='wipe'){ if(!confirm('Alle Testdaten löschen? Die Anmeldung erfolgt danach automatisch erneut.')) return; for(const k of await sList('')) await sDel(k); state.dek=null; state.record=null; state.progress={}; state.profile=null; await autoProvisionKeystore(); await loadProgress(); state.view='app'; state.sub='start'; setStatus('ok','Testdaten zurückgesetzt — automatisch neu angemeldet.'); render(); return; }
});

/* ---------- Range-Live-Ausgaben ---------- */
document.addEventListener('input', (e)=>{ if(e.target.matches('input[type=range][data-out]')){ const o=document.getElementById(e.target.dataset.out); if(o) o.textContent=e.target.value; } });

/* ---------- Formular-Delegation ---------- */
document.addEventListener('submit', async (e)=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const kind=f.dataset.form; const d=Object.fromEntries(new FormData(f).entries());
  try{
    if(kind==='setup') return await onSetup(d);
    if(kind==='unlock') return await onUnlock(d);
    if(kind==='recovery') return await onRecovery(d);
    if(kind==='quickcheck'||kind==='quickcheck2') return await onCheck(d, kind);
    if(kind==='thought') return await onThought(d);
    if(kind==='abc') return await onAbc(d);
    if(kind==='problem') return await onProblem(d);
    if(kind==='contact') return await onContact(d);
  }catch(err){ setStatus('err','Es ist ein Fehler aufgetreten: '+err.message); render(); }
});

/* ---------- Handler ---------- */
async function onSetup(d){
  if((d.pass||'').length<8){ setStatus('err','Die Passphrase braucht mindestens 8 Zeichen.'); return renderOnboarding(); }
  if(d.pass!==d.pass2){ setStatus('err','Die beiden Passphrasen stimmen nicht überein.'); return renderOnboarding(); }
  const {record, recoveryDisplay, dek}=await createKeystore(d.pass);
  await sSet('keystore', record); state.record=record; state.dek=dek;
  state.progress=defaultProgress(); await saveProgress();
  if(state.onboard.situation){ state.profile={situation:state.onboard.situation}; await saveProfile(); }
  setStatus(null); renderRecovery(recoveryDisplay);
}
async function onUnlock(d){
  try{ state.dek=await unlockPassphrase(state.record, d.pass); }
  catch(err){ setStatus('err','Die Passphrase ist nicht korrekt.'); return renderUnlock(); }
  await loadProgress(); await loadProfile(); state.view='app'; state.sub='start'; setStatus(null); render();
}
async function onRecovery(d){
  try{ const {record, dek}=await resetWithRecovery(state.record, d.code, d.newpass); await sSet('keystore', record); state.record=record; state.dek=dek; }
  catch(err){ setStatus('err','Der Recovery-Code ist nicht korrekt.'); return renderUnlock(); }
  await loadProgress(); await loadProfile(); state.view='app'; state.sub='start'; setStatus(null); render();
}
async function onCheck(d, kind){
  const mood=Number(d.mood), stress=Number(d.stress);
  await saveEntry('checkin', {at:nowIso(), mood, stress});
  if(mood<=2){ setStatus('care','Das klingt nach einem sehr schweren Moment. Sie müssen da nicht allein durch — unter „Hilfe" finden Sie sofort erreichbare, anonyme Anlaufstellen.'); }
  else { setStatus('ok','Eintrag gespeichert. Gut, dass Sie kurz innegehalten haben.'); }
  if(kind==='quickcheck2') return renderVerlauf();
  return renderStart();
}
async function onThought(d){
  if(!d.trigger.trim()||!d.automatic.trim()||!d.alternative.trim()){ setStatus('err','Bitte füllen Sie die drei Textfelder aus.'); return renderModule('cognitive-restructuring'); }
  await saveEntry('thought', {at:nowIso(), trigger:d.trigger.trim(), automatic:d.automatic.trim(), alternative:d.alternative.trim(), before:Number(d.before), after:Number(d.after)});
  const p=state.progress['cognitive-restructuring']; p.toolUses++; saveProgress();
  setStatus('ok','Eintrag verschlüsselt gespeichert.'); renderModule('cognitive-restructuring');
}
async function onAbc(d){
  if(!d.antecedent.trim()||!d.behavior.trim()||!d.consequence.trim()){ setStatus('err','Bitte füllen Sie Auslöser, Verhalten und Folge aus.'); return renderModule('behavior-management'); }
  await saveEntry('abc', {at:nowIso(), antecedent:d.antecedent.trim(), behavior:d.behavior.trim(), consequence:d.consequence.trim(), coping:(d.coping||'').trim()});
  const p=state.progress['behavior-management']; p.toolUses++; saveProgress();
  setStatus('ok','Eintrag verschlüsselt gespeichert.'); renderModule('behavior-management');
}
async function onProblem(d){
  if(!d.problem.trim()||!d.options.trim()||!d.chosen.trim()){ setStatus('err','Bitte füllen Sie alle Felder aus.'); return renderModule('stress-problem-solving'); }
  await saveEntry('problem', {at:nowIso(), problem:d.problem.trim(), options:d.options.trim(), chosen:d.chosen.trim()});
  const p=state.progress['stress-problem-solving']; p.toolUses++; saveProgress();
  setStatus('ok','Eintrag verschlüsselt gespeichert.'); renderModule('stress-problem-solving');
}
async function onContact(d){
  if(!d.name.trim()||!d.role.trim()){ setStatus('err','Bitte Name und Rolle angeben.'); return renderModule('social-support'); }
  await saveEntry('contact', {at:nowIso(), name:d.name.trim(), role:d.role.trim(), note:(d.note||'').trim()});
  const p=state.progress['social-support']; p.toolUses++; saveProgress();
  setStatus('ok','Eintrag verschlüsselt gespeichert.'); renderModule('social-support');
}

/* ---------- Export ---------- */
async function collectForExport(){
  const cks=[], ths=[];
  for(const e of await listEntries('checkin')){ const r=await loadEntry('checkin', e.id); if(r){ r.payload.id=e.id; cks.push(r.payload); } }
  for(const e of await listEntries('thought')){ const r=await loadEntry('thought', e.id); if(r){ r.payload.id=e.id; ths.push(r.payload); } }
  return {cks, ths};
}
function download(name, text, type){
  const blob=new Blob([text], {type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function doExport(which){
  const out=document.getElementById('export-out'); if(!out) return;
  const {cks, ths}=await collectForExport();
  if(cks.length===0 && ths.length===0){ out.innerHTML='<div class="alert alert-care" role="status">Noch keine Einträge zum Exportieren vorhanden.</div>'; return; }
  if(which==='human'){
    const text=buildHumanSummary(cks, ths);
    out.innerHTML=`<div class="kv" id="exp-text">${esc(text)}</div><div class="btn-row"><button class="btn btn-ghost" data-dl="human">Als Textdatei speichern</button></div>`;
    out.querySelector('[data-dl=human]').addEventListener('click', ()=>download('careshield-uebersicht.txt', text, 'text/plain;charset=utf-8'));
  } else {
    const bundle=buildFhirBundle(cks, ths); const json=JSON.stringify(bundle, null, 2);
    out.innerHTML=`<div class="kv">${esc(json.slice(0,1400))}${json.length>1400?'\n… ('+json.length+' Zeichen gesamt)':''}</div><div class="btn-row"><button class="btn btn-ghost" data-dl="fhir">FHIR-Bundle speichern (.json)</button></div>`;
    out.querySelector('[data-dl=fhir]').addEventListener('click', ()=>download('careshield-fhir-bundle.json', json, 'application/fhir+json'));
  }
}

   Registriert ./careshield-sw.js, falls vorhanden. In der Vorschau und ohne

if (location.protocol === 'https:' && 'serviceWorker' in navigator) {

}

applyFont();
boot();
